# prettier-ignore-file
# yamllint disable
---
# Detect which JSON format
- name: Detect JSON format type
  ansible.builtin.set_fact:
    # Check if it's instance group format (has 'ips' array)
    is_instance_group: "{{ dns_operation.serverInstanceGroupDNSRecordSet is defined and dns_operation.serverInstanceGroupDNSRecordSet.ips is defined }}"
    # Check if it's single instance format (has 'ip' object)
    is_instance: "{{ dns_operation.serverInstanceDNSRecordSet is defined and dns_operation.serverInstanceDNSRecordSet.ip is defined }}"
    # Check if it's server format (physical server management)
    is_server: "{{ dns_operation.serverDNSRecordSet is defined }}"
    # Check if it's switch format (network switch management)
    is_switch: "{{ dns_operation.switchDNSRecordSet is defined }}"
    # Legacy format check remains the same
    is_legacy: "{{ dns_operation.records is defined }}"

# Detect management address type for servers
- name: Analyze management address type for servers
  when: is_server
  ansible.builtin.set_fact:
    mgmt_is_ipv4: "{{ dns_operation.serverDNSRecordSet.managementAddress | regex_search('^[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}$') }}"
    mgmt_is_ipv6: "{{ ':' in dns_operation.serverDNSRecordSet.managementAddress }}"
    mgmt_is_hostname: "{{ not (dns_operation.serverDNSRecordSet.managementAddress | regex_search('^[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}$')) and ':' not in dns_operation.serverDNSRecordSet.managementAddress }}"

# Detect management address type for switches
- name: Analyze management address type for switches
  when: is_switch
  ansible.builtin.set_fact:
    mgmt_is_ipv4: "{{ dns_operation.switchDNSRecordSet.managementAddress | regex_search('^[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}$') }}"
    mgmt_is_ipv6: "{{ ':' in dns_operation.switchDNSRecordSet.managementAddress }}"
    mgmt_is_hostname: "{{ not (dns_operation.switchDNSRecordSet.managementAddress | regex_search('^[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}$')) and ':' not in dns_operation.switchDNSRecordSet.managementAddress }}"

# Transform instance group format
- name: Transform instance group format
  when: is_instance_group
  ansible.builtin.set_fact:
    transformed_operation:
      zone: "{{ dns_operation.serverInstanceGroupDNSRecordSet.zone.zoneName }}"
      operation: "{{ 'server_instance_group_dns_deprovisioning' if dns_operation.serverInstanceGroupDNSRecordSet.operation == 'delete' else 'server_instance_group_dns_provisioning' }}"
      nameservers: "{{ dns_operation.serverInstanceGroupDNSRecordSet.zone.nameServers }}"
      records:
      - name: "{{ dns_operation.serverInstanceGroupDNSRecordSet.hostname }}"
        type: "A"
        ips: "{{ [] if dns_operation.serverInstanceGroupDNSRecordSet.operation == 'delete' else dns_operation.serverInstanceGroupDNSRecordSet.ips | selectattr('status', 'equalto', 'allocated') | map(attribute='ip') | list }}"
        ttl: "{{ dns_operation.serverInstanceGroupDNSRecordSet.zone.ttl | default(3600) }}"
      infrastructure_id: "{{ dns_operation.serverInstanceGroupDNSRecordSet.infrastructureId }}"
      soa_email: "{{ dns_operation.serverInstanceGroupDNSRecordSet.zone.soaEmail }}"

# Transform instance format
- name: Transform instance format
  when: is_instance
  ansible.builtin.set_fact:
    transformed_operation:
      zone: "{{ dns_operation.serverInstanceDNSRecordSet.zone.zoneName }}"
      operation: "{{ 'server_instance_dns_deprovisioning' if dns_operation.serverInstanceDNSRecordSet.operation == 'delete' else 'server_instance_dns_provisioning' }}"
      nameservers: "{{ dns_operation.serverInstanceDNSRecordSet.zone.nameServers }}"
      records: >-
        {%- if dns_operation.serverInstanceDNSRecordSet.operation == 'delete' -%}
          {{ [{'name': dns_operation.serverInstanceDNSRecordSet.hostname, 'type': 'A', 'ips': [dns_operation.serverInstanceDNSRecordSet.ip.ip] if dns_operation.serverInstanceDNSRecordSet.ip.ip is defined else []}] }}
        {%- else -%}
          {{ [{'name': dns_operation.serverInstanceDNSRecordSet.hostname, 'type': 'A', 'ips': [dns_operation.serverInstanceDNSRecordSet.ip.ip] if dns_operation.serverInstanceDNSRecordSet.ip.status == 'allocated' else [], 'ttl': dns_operation.serverInstanceDNSRecordSet.zone.ttl | default(3600)}] }}
        {%- endif -%}
      infrastructure_id: "{{ dns_operation.serverInstanceDNSRecordSet.infrastructureId }}"
      soa_email: "{{ dns_operation.serverInstanceDNSRecordSet.zone.soaEmail }}"

# Transform server format (physical servers)
- name: Transform server format
  when: is_server
  ansible.builtin.set_fact:
    transformed_operation:
      zone: "{{ dns_operation.serverDNSRecordSet.zone.zoneName }}"
      operation: "{{ 'server_dns_deprovisioning' if dns_operation.serverDNSRecordSet.operation == 'delete' else 'server_dns_provisioning' }}"
      nameservers: "{{ dns_operation.serverDNSRecordSet.zone.nameServers }}"
      records: >-
        {%- if dns_operation.serverDNSRecordSet.operation == 'delete' -%}
          {{ [
            {'name': dns_operation.serverDNSRecordSet.hostname, 'type': 'A', 'ips': [dns_operation.serverDNSRecordSet.ip.ip] if dns_operation.serverDNSRecordSet.ip.ip is defined else []},
            {'name': dns_operation.serverDNSRecordSet.hostname, 'type': 'AAAA'},
            {'name': dns_operation.serverDNSRecordSet.hostname, 'type': 'CNAME'}
          ] }}
        {%- else -%}
          {%- if mgmt_is_ipv6 -%}
            {{ [{'name': dns_operation.serverDNSRecordSet.hostname, 'type': 'AAAA', 'ips': [dns_operation.serverDNSRecordSet.managementAddress] if dns_operation.serverDNSRecordSet.ip.status == 'allocated' else [], 'ttl': dns_operation.serverDNSRecordSet.zone.ttl | default(3600)}] }}
          {%- elif mgmt_is_ipv4 -%}
            {{ [{'name': dns_operation.serverDNSRecordSet.hostname, 'type': 'A', 'ips': [dns_operation.serverDNSRecordSet.managementAddress] if dns_operation.serverDNSRecordSet.ip.status == 'allocated' else [], 'ttl': dns_operation.serverDNSRecordSet.zone.ttl | default(3600)}] }}
          {%- else -%}
            {{ [{'name': dns_operation.serverDNSRecordSet.hostname, 'type': 'CNAME', 'target': dns_operation.serverDNSRecordSet.managementAddress, 'ttl': dns_operation.serverDNSRecordSet.zone.ttl | default(3600)}] }}
          {%- endif -%}
        {%- endif -%}
      infrastructure_id: "{{ dns_operation.serverDNSRecordSet.serverId }}"
      soa_email: "{{ dns_operation.serverDNSRecordSet.zone.soaEmail }}"

# Transform switch format (network switches)
- name: Transform switch format
  when: is_switch
  ansible.builtin.set_fact:
    transformed_operation:
      zone: "{{ dns_operation.switchDNSRecordSet.zone.zoneName }}"
      operation: "{{ 'switch_dns_deprovisioning' if dns_operation.switchDNSRecordSet.operation == 'delete' else 'switch_dns_provisioning' }}"
      nameservers: "{{ dns_operation.switchDNSRecordSet.zone.nameServers }}"
      records: >-
        {%- if dns_operation.switchDNSRecordSet.operation == 'delete' -%}
          {{ [
            {'name': dns_operation.switchDNSRecordSet.hostname, 'type': 'A', 'ips': [dns_operation.switchDNSRecordSet.ip.ip] if dns_operation.switchDNSRecordSet.ip.ip is defined else []},
            {'name': dns_operation.switchDNSRecordSet.hostname, 'type': 'AAAA'},
            {'name': dns_operation.switchDNSRecordSet.hostname, 'type': 'CNAME'}
          ] }}
        {%- else -%}
          {%- if mgmt_is_ipv6 -%}
            {{ [{'name': dns_operation.switchDNSRecordSet.hostname, 'type': 'AAAA', 'ips': [dns_operation.switchDNSRecordSet.managementAddress] if dns_operation.switchDNSRecordSet.ip.status == 'allocated' else [], 'ttl': dns_operation.switchDNSRecordSet.zone.ttl | default(3600)}] }}
          {%- elif mgmt_is_ipv4 -%}
            {{ [{'name': dns_operation.switchDNSRecordSet.hostname, 'type': 'A', 'ips': [dns_operation.switchDNSRecordSet.managementAddress] if dns_operation.switchDNSRecordSet.ip.status == 'allocated' else [], 'ttl': dns_operation.switchDNSRecordSet.zone.ttl | default(3600)}] }}
          {%- else -%}
            {{ [{'name': dns_operation.switchDNSRecordSet.hostname, 'type': 'CNAME', 'target': dns_operation.switchDNSRecordSet.managementAddress, 'ttl': dns_operation.switchDNSRecordSet.zone.ttl | default(3600)}] }}
          {%- endif -%}
        {%- endif -%}
      infrastructure_id: "{{ dns_operation.switchDNSRecordSet.switchId }}"
      soa_email: "{{ dns_operation.switchDNSRecordSet.zone.soaEmail }}"

# Updated to include is_server and is_switch
- name: Set working operation
  ansible.builtin.set_fact:
    working_operation: "{{ transformed_operation if (is_instance_group or is_instance or is_server or is_switch) else dns_operation }}"

# Helper to check if record has content
- name: Check if record has content
  ansible.builtin.set_fact:
    has_record_content: "{{ (working_operation.records[0].ips | default([]) | length > 0) or (working_operation.records[0].target | default('') | length > 0) }}"

# Using working_operation for all subsequent tasks
- name: Parse zone name
  ansible.builtin.set_fact:
    zone_name: "{{ working_operation.zone }}{{ '.' if not working_operation.zone.endswith('.') else '' }}"
    is_destroy: "{{ working_operation.operation is search('deprovision') }}"

- name: Skip if no content for create/edit
  ansible.builtin.meta: end_play
  when:
  - not is_destroy
  - not has_record_content

- name: Display operation details
  ansible.builtin.debug:
    msg:
    - "Format: {{ 'Switch' if is_switch else 'Server' if is_server else 'Instance Group' if is_instance_group else 'Instance' if is_instance else 'Legacy' }}"
    - "Operation: {{ working_operation.operation }}"
    - "Zone: {{ zone_name }}"
    - "Records: {{ working_operation.records | default([]) }}"
    - "Action: {{ 'Destroying' if is_destroy else 'Creating/Updating' }}"

- name: Validate PowerDNS API connectivity
  ansible.builtin.uri:
    url: "{{ powerdns_base_url }}"
    headers:
      X-API-Key: "{{ powerdns_api_key }}"
    status_code: 200

- name: Get existing zones
  ansible.builtin.uri:
    url: "{{ powerdns_base_url }}/zones"
    method: GET
    headers:
      X-API-Key: "{{ powerdns_api_key }}"
  register: zones_list

- name: Check if zone exists
  ansible.builtin.set_fact:
    zone_exists: "{{ (zones_list.json | selectattr('name', 'equalto', zone_name) | list | length > 0) if (zones_list is defined and 'json' in zones_list) else false }}"
    zone_data: "{{ (zones_list.json | selectattr('name', 'equalto', zone_name) | list | first) if (zones_list is defined and 'json' in zones_list and zones_list.json | selectattr('name', 'equalto', zone_name) | list | length > 0) else {} }}"

- name: Set zone_id
  ansible.builtin.set_fact:
    zone_id: "{{ zone_data.id | default(zone_name) }}"

# CREATE/EDIT Operations
- name: Handle CREATE/EDIT operations
  when: not is_destroy
  block:
  - name: Create zone if needed
    ansible.builtin.include_tasks: create_zone.yml
    when: not zone_exists

  - name: Add/Update records in zone
    ansible.builtin.include_tasks: create_records.yml
    when:
    - working_operation.records is defined
    - working_operation.records | length > 0
    - has_record_content
    - zone_exists or zone_created | default(false)

  - name: Handle PTR records only for IPv4 addresses (type 'A')
    ansible.builtin.include_tasks: create_ptr.yml
    when:
    - working_operation.operation is search("server_instance_dns_provisioning|server_dns_provisioning|switch_dns_provisioning")
    - working_operation.records is defined
    loop: "{{ working_operation.records | selectattr('type', 'equalto', 'A') | list }}"
    loop_control:
      loop_var: a_record

# DELETE Operations
- name: Handle DELETE operations
  when: is_destroy
  block:
  - name: Remove records from zone
    ansible.builtin.include_tasks: destroy_records.yml
    when:
    - zone_exists
    - working_operation.records is defined
    - working_operation.records | length > 0

  # Clean up PTR records during deletion
  - name: Handle PTR cleanup for deleted servers/switches
    ansible.builtin.include_tasks: destroy_ptr.yml
    when:
    - working_operation.operation is search("server_instance_dns_deprovisioning|server_dns_deprovisioning|switch_dns_deprovisioning")
    - working_operation.records is defined
    loop: "{{ working_operation.records | selectattr('type', 'equalto', 'A') | selectattr('ips', 'defined') | list }}"
    loop_control:
      loop_var: a_record

  - name: Delete zone completely
    ansible.builtin.include_tasks: delete_zone.yml
    when:
    - zone_exists
    - working_operation.operation == "dns_zone_deprovisioning"
