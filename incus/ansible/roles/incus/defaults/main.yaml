---
# Site-level admin settings arrive under configVars.<label> (Extension Site Config);
# per-instance settings arrive under extensionInstanceVariables.<label>. Migrated
# settings keep the legacy extensionInstanceVariables fallback so this bundle also
# works against instances deployed from the pre-configVars definition.
# Boolean chains use dict-get with an explicit fallback (not `default(x, true)`)
# because a legitimate `false` value is falsy and would fall through.

incus_vars_debugging_enabled: >-
  {{ ((configVars | default({})).get('vars_debugging_enabled',
      extensionInstanceVariables.vars_debugging_enabled | default(false))) | bool }}

# Normalized to a LIST. Site configVars may arrive as a comma-separated string; the
# legacy per-instance input did too. The recordSet resolvers can be stale/public
# (1.1.1.1) — they are the fallback, not the authority.
incus_cluster_node_dns_servers: >-
  {{ (((configVars | default({})).get('DNSResolvers', '') ~ '').split(',')
      | map('trim') | reject('equalto', '') | list)
     or ((extensionInstanceVariables.cluster_node_dns_servers | default('', true) ~ '').split(',')
      | map('trim') | reject('equalto', '') | list)
     or (extensionInstanceRecordSet.dnsResolvers | default([], true))
     or ['1.1.1.1', '8.8.8.8'] }}

incus_host_architecture_groups:
  x86_64: amd64
  aarch64: arm64
  armv7l: arm

incus_toolset_paths:
  incus_agent: /opt/incus/agent
  incus_bin: /opt/incus/bin
  incus_doc: /opt/incus/doc
  incus_lib: /opt/incus/lib
  incus_share: /opt/incus/share
  incus_ui: /opt/incus/ui

incus_client_config_paths: "/root/.config/incus/config.yml"

incus_run_paths:
  incus_backup: /var/lib/incus/backup
  incus_bootstrap_config: /var/lib/incus/bootstrap-config
  incus_containers: /var/lib/incus/containers
  incus_containers_snapshots: /var/lib/incus/containers-snapshots
  incus_database: /var/lib/incus/database
  incus_devices: /var/lib/incus/devices
  incus_disks: /var/lib/incus/disks
  incus_guestapi: /var/lib/incus/guestapi
  incus_images: /var/lib/incus/images
  incus_networks: /var/lib/incus/networks
  incus_security: /var/lib/incus/security
  incus_shmounts: /var/lib/incus/shmounts
  incus_storage_pools: /var/lib/incus/storage-pools
  incus_virtual_machines: /var/lib/incus/virtual-machines
  incus_virtual_machines_snapshots: /var/lib/incus/virtual-machines-snapshots

incus_bootstrap_config_dir: "{{ incus_run_paths.incus_bootstrap_config }}"

incus_host_architecture: >-
  {%- if ansible_facts['architecture'] in incus_host_architecture_groups -%}
  {{ incus_host_architecture_groups[ansible_facts['architecture']] }}
  {%- else -%}
  {{ ansible_facts['architecture'] }}
  {%- endif -%}

incus_cluster_enabled: >-
  {%- if extensionInstanceVariables.cluster_enabled is defined -%}
  {{ extensionInstanceVariables.cluster_enabled | bool }}
  {%- else -%}
  false
  {%- endif -%}

# possible values: daily, stable or lts-6.0
incus_branch_release: >-
  {{ (configVars | default({})).get('branch_release')
     | default(extensionInstanceVariables.branch_release | default('', true), true)
     | default('stable', true) }}

incus_install_ui: >-
  {%- if extensionInstanceVariables.install_ui is defined -%}
  {{ extensionInstanceVariables.install_ui | bool }}
  {%- else -%}
  true
  {%- endif -%}

# possible values: dir, btrfs, lvm, lvmcluster, zfs, ceph, cephfs or cephobject
incus_storage_driver: >-
  {%- if extensionInstanceVariables.storage_driver is defined and
  extensionInstanceVariables.storage_driver is not none and extensionInstanceVariables.storage_driver | length -%}
  {{ extensionInstanceVariables.storage_driver }}
  {%- else -%}
  dir
  {%- endif -%}

incus_core_https_port: >-
  {{ (configVars | default({})).get('core_https_port')
     | default(extensionInstanceVariables.core_https_port | default(8443, true), true) }}

incus_core_https_address: "{{ ansible_facts['default_ipv4']['address'] }}:{{ incus_core_https_port }}"

# When true, cluster traffic uses a dedicated port (API port + 1) instead of the API address.
incus_separate_api_and_cluster_traffic: >-
  {{ ((configVars | default({})).get('separate_api_and_cluster_traffic',
      extensionInstanceVariables.separate_api_and_cluster_traffic | default(false))) | bool }}

incus_images_auto_update_interval: >-
  {{ (configVars | default({})).get('images_auto_update_interval')
     | default(extensionInstanceVariables.images_auto_update_interval | default(6, true), true) }}

incus_cluster_scale_out_enabled: >-
  {%- if groups['incus_scale_out'] is defined and groups['incus_scale_out'] is not none and groups['incus_scale_out'] | length -%}
  true
  {%- else -%}
  false
  {%- endif -%}

incus_cluster_scale_in_enabled: >-
  {%- if groups['incus_scale_in'] is defined and groups['incus_scale_in'] is not none and groups['incus_scale_in'] | length -%}
  true
  {%- else -%}
  false
  {%- endif -%}

incus_cluster_member_force_remove_enabled: >-
  {{ ((configVars | default({})).get('cluster_member_force_remove_enabled',
      extensionInstanceVariables.cluster_member_force_remove_enabled | default(false))) | bool }}

incus_cluster_member_upgrade_enabled: >-
  {{ ((configVars | default({})).get('cluster_member_upgrade_enabled',
      extensionInstanceVariables.cluster_member_upgrade_enabled | default(false))) | bool }}

# --- Browser client certificate (generated once on incus[0], deploy.yaml only) ---
incus_user_cert_dir: /var/lib/incus/user-certs
incus_user_cert_path: "{{ incus_user_cert_dir }}/browser-client.crt"
incus_user_key_path: "{{ incus_user_cert_dir }}/browser-client.key"
incus_user_cert_name: >-
  {{ (extensionInstanceRecordSet.extensionInstanceName | default('incus', true)) ~ '-browser-user' }}
incus_user_cert_validity_days: 3650

# --- Extension outputs (context.json) ---
# The platform REPLACES the instance's stored outputs with every successful run's
# context.json top-level keys — see tasks/emit-outputs.yaml. All values below are
# derivable from the recordSet/inventory on ANY run, so every lifecycle playbook
# re-emits the full payload. FQDNs: inventory hostnames are the permanent subdomain;
# compose <host>.<baseDomain> for dot-less names, strip trailing dots.
context_json_file_path: "/runner/artifacts/{{ lookup('env', 'ANSIBLE_RUNNER_IDENT') }}/context.json"

_output_base_domain: "{{ extensionInstanceRecordSet.baseDomain | default('') | regex_replace('\\.$', '') }}"

# Qualify ONLY dot-less inventory hostnames with the base domain — hostnames may
# already arrive fully qualified (e.g. instance-683.us06.metalsoft.io) and appending
# unconditionally doubles the domain. Named group ref (\g<short>) on purpose: numeric
# backreferences (\1) don't survive the folded-scalar + Jinja escaping on
# ansible-core 2.20.
_output_member_fqdns: >-
  {{ (groups['incus'] | default([])
      | map('regex_replace', '\.$', '')
      | map('regex_replace', '^(?P<short>[^.]+)$', '\g<short>.' ~ _output_base_domain)
      | list)
     if _output_base_domain else
     (groups['incus'] | default([]) | map('regex_replace', '\.$', '') | list) }}

_output_first_member_fqdn: "{{ _output_member_fqdns | first | default('') }}"

_output_api_url: >-
  {{ ('https://' ~ _output_first_member_fqdn ~ ':' ~ incus_core_https_port)
     if _output_first_member_fqdn else '' }}

_output_first_member_host: "{{ groups['incus'] | default([]) | first | default('') }}"

# Persisted cert/key from a previous deployment: the platform re-injects stored
# customJson.outputs into extensionInstanceVariables on later deployments
# (controllers >= 2026-07); some builds expose them as extensionInstanceOutputs.
# (The validator on this platform rejects same-label input/output pairs, so the
# hidden-input persistence channel is not available — outputs re-injection is
# the only cross-deployment read-back path.)
_persisted_browser_client_certificate: >-
  {{ extensionInstanceVariables.browser_client_certificate
     | default(extensionInstanceOutputs.browser_client_certificate | default('', true), true) }}

_persisted_browser_client_certificate_key: >-
  {{ extensionInstanceVariables.browser_client_certificate_key
     | default(extensionInstanceOutputs.browser_client_certificate_key | default('', true), true) }}

# Browser cert/key fallback chain — first non-empty wins:
#   1. fact slurped on incus[0] THIS run (fresh deploy / rotation),
#   2. persisted stored-output value re-injected by the platform
#      (scale/upgrade runs — the localhost emit play never touches the nodes),
#   3. '' before the first successful deploy (also legacy pre-1.1.2 instances).
_output_browser_client_certificate: >-
  {{ hostvars.get(_output_first_member_host, {}).get('incus_browser_client_certificate_pem', '')
     or _persisted_browser_client_certificate }}

_output_browser_client_certificate_key: >-
  {{ hostvars.get(_output_first_member_host, {}).get('incus_browser_client_certificate_key_pem', '')
     or _persisted_browser_client_certificate_key }}

# Every declared output label must be present on every write — partial writes wipe
# the omitted keys. cluster_ui_url is deliberately '' when the UI is not installed.
incus_outputs_payload:
  cluster_api_url: "{{ _output_api_url }}"
  cluster_ui_url: "{{ _output_api_url if (incus_install_ui | bool) else '' }}"
  cluster_members: "{{ _output_member_fqdns | join(',') }}"
  cluster_member_count: "{{ _output_member_fqdns | length }}"
  cluster_storage_driver: "{{ incus_storage_driver }}"
  incus_release: "{{ incus_branch_release }}"
  browser_client_certificate: "{{ _output_browser_client_certificate }}"
  browser_client_certificate_key: "{{ _output_browser_client_certificate_key }}"
