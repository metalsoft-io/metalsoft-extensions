---
# Settings that allow Incus to run a large number of instances
# https://linuxcontainers.org/incus/docs/main/reference/server_settings/#server-settings
- name: Tune server security limits
  community.general.pam_limits:
    dest: /etc/security/limits.conf
    domain: "{{ item.domain }}"
    limit_type: "{{ item.limit_type }}"
    limit_item: "{{ item.limit_item }}"
    value: "{{ item.value }}"
  with_items:
    - { domain: "*", limit_type: "soft", limit_item: "nofile", value: 1048576 }
    - { domain: "*", limit_type: "hard", limit_item: "nofile", value: 1048576 }
    - { domain: "root", limit_type: "soft", limit_item: "nproc", value: 1048576 }
    - { domain: "root", limit_type: "hard", limit_item: "nproc", value: 1048576 }
    - { domain: "*", limit_type: "soft", limit_item: "memlock", value: "unlimited" }
    - { domain: "*", limit_type: "hard", limit_item: "memlock", value: "unlimited" }
    - { domain: "root", limit_type: "soft", limit_item: "memlock", value: "unlimited" }
    - { domain: "root", limit_type: "hard", limit_item: "memlock", value: "unlimited" }

- name: Tune server sysctl settings
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.conf
    sysctl_set: true
    state: present
    reload: true
  with_items:
    - { name: "fs.aio-max-nr", value: 524288 }
    - { name: "fs.inotify.max_queued_events", value: 1048576 }
    - { name: "fs.inotify.max_user_instances", value: 1048576 }
    - { name: "fs.inotify.max_user_watches", value: 1048576 }
    - { name: "kernel.dmesg_restrict", value: 1 }
    - { name: "kernel.keys.maxbytes", value: 2000000 }
    - { name: "kernel.keys.maxkeys", value: 2000 }
    - { name: "net.core.bpf_jit_limit", value: 1000000000 }
    - { name: "net.ipv4.neigh.default.gc_thresh3", value: 8192 }
    - { name: "net.ipv6.neigh.default.gc_thresh3", value: 8192 }
    - { name: "vm.max_map_count", value: 262144 }

- name: Ensure systemd-resolved drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/resolved.conf.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Deploy Incus systemd-resolved drop-in
  ansible.builtin.template:
    src: systemd-resolved-incus.conf.j2
    dest: /etc/systemd/resolved.conf.d/incus.conf
    owner: root
    group: root
    mode: '0644'
  notify:
    - Restart systemd-resolved

# - name: Restart Incus systemctl services
- name: Systemctl daemon_reload
  ansible.builtin.systemd: # old version of ansible
  # ansible.builtin.systemd_service: # new version of ansible
    scope: system
    daemon_reexec: true
    daemon_reload: true
  #   state: restarted
  #   name: "{{ item }}"
  # with_items:
  #   - { name: 'incus-lxcfs.service' }
  #   - { name: 'incus.service' }
  #   - { name: 'incus-startup.service' }
  #   - { name: 'incus-user.service' }

- name: Trigger handlers
  ansible.builtin.meta:
    flush_handlers
