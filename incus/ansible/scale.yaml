---
- name: Get facts | incus nodes
  hosts: incus
  gather_facts: true
  tasks: []

- name: Scale up cluster
  hosts: incus_scale_up
  become: true
  tasks:
    - name: Scale up cluster
      ansible.builtin.include_role:
        name: incus
        tasks_from: incus-scale-up.yaml
      when: groups['incus_scale_up'] is defined and (groups['incus_scale_up'] | length > 0)

- name: Scale down cluster | one node at a time
  hosts: incus_scale_down
  become: true
  serial: 1
  tasks:
    - name: Scale down cluster
      ansible.builtin.include_role:
        name: incus
        tasks_from: incus-scale-down.yaml
      when: groups['incus_scale_down'] is defined and (groups['incus_scale_down'] | length > 0)
