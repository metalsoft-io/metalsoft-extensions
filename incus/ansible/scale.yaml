---
# onEdit lifecycle playbook — registered at BOTH preDeploy and postDeploy. Plays
# self-select via the platform-generated scale groups (empty group -> no-op):
#   preDeploy:  incus_scale_in populated (hosts still up) -> evacuate + remove;
#               incus_scale_out hosts exist in inventory but are not reachable yet.
#   postDeploy: incus_scale_out provisioned -> install + join.

# Increase cluster size by adding one or more nodes.
- name: Scale out cluster
  hosts: incus_scale_out
  become: true
  gather_facts: true
  tasks:
    - name: Scale out cluster
      ansible.builtin.include_role:
        name: incus
        tasks_from: incus-scale-out.yaml
      when: groups.get('incus_scale_out', []) | length > 0

# Decrease cluster size by removing/decommissioning one or more nodes.
- name: Scale in cluster | one node at a time
  hosts: incus_scale_in
  become: true
  gather_facts: true
  serial: 1
  tasks:
    - name: Scale in cluster
      ansible.builtin.include_role:
        name: incus
        tasks_from: incus-scale-in.yaml
      when: groups.get('incus_scale_in', []) | length > 0

# Stored outputs are REPLACED by every successful run's context.json, and BOTH onEdit
# stages run this playbook — a run that writes none (no-op edit, scale-in-only) would
# WIPE the outputs. Always re-publish them as the last play; localhost always matches
# even when both scale groups are empty.
- name: Publish extension outputs
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Emit outputs context JSON
      ansible.builtin.include_role:
        name: incus
        tasks_from: emit-outputs.yaml
