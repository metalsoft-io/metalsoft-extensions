---
version: 3

images:
  base_image:
    name: registry.fedoraproject.org/fedora:latest

dependencies:
  ansible_core:
    package_pip: ansible-core==2.20.1
  ansible_runner:
    package_pip: ansible-runner

  python:
    # Required for json_query filter
    - jmespath
  # system-level packages (RPM names)
  system:
    - shadow-utils [platform:rpm]
    - openssh-clients [platform:rpm]
    - openssl [platform:rpm]
    - python3 [platform:rpm]
    - python3-devel [platform:rpm]
    - gcc [platform:rpm]
    - make [platform:rpm]
    - libffi-devel [platform:rpm]
    - openssl-devel [platform:rpm]

  galaxy:
    collections:
      - name: community.general
        version: ">=9.0.0"
      - name: ansible.posix
        version: ">=2.1.0"
  python_interpreter:
    package_system: "python3"
    python_path: "/usr/bin/python3"
  exclude:
    python:
      - docker
    system:
      - python3-Cython

build_arg_defaults:
  PKGMGR_PRESERVE_CACHE: 'always'

additional_build_steps:
  prepend_base:
    - RUN echo "No repo tweaks for Fedora base; using defaults"

  prepend_final: |
    RUN whoami
    RUN cat /etc/os-release
  append_final:
    - RUN echo "Post-install steps"
    - RUN useradd -u 1000 -g 0 -m runner || echo "User 1000 already exists"
    - RUN mkdir -p /runner/project/.ansible/tmp && chmod 1777 /runner/project/.ansible/tmp
    - RUN ls -la /etc
    - RUN if [ -x /usr/bin/python3 ] && [ ! -x /usr/bin/python3 ]; then ln -s /usr/bin/python3 /usr/bin/python3 || true; fi
    - RUN echo "--- Final Image Python Version ---" && $PYCMD --version
