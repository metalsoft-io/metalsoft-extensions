---
# Infoblox WAPI connection details
# These should be overridden via extra vars or variables.json
#infoblox_host: "10.255.146.53"
infoblox_host: "192.168.1.55"
infoblox_username: "admin"
infoblox_password: "infoblox"
#infoblox_password: "infoblox123"
infoblox_validate_certs: false
infoblox_wapi_version: "2.12"  # adjust if your grid uses a different version

# Provider dict used by infoblox.nios_modules
nios_provider:
  host: "{{ infoblox_host }}"
  username: "{{ infoblox_username }}"
  password: "{{ infoblox_password }}"
  validate_certs: "{{ infoblox_validate_certs }}"
  wapi_version: "{{ infoblox_wapi_version }}"

# DNS view (Infoblox default view usually 'default')
infoblox_view: "default"

# Default TTL
default_ttl: 3600

# Behavior flags
create_reverse_zones: true   # create reverse zone automatically when creating PTR
ptr_require_existing_zone: false  # if true, will not attempt to create reverse zone

# IP Allocation (auto-assign from Infoblox IPAM when no IP provided or 'AUTO' token used)
auto_create_ipv4_network: true     # if true and network missing, attempt to create it (CIDR must not already exist)
allocate_ipv4_method: "lookup"       # default 'wapi' avoids macOS fork crash; 'lookup' uses nios_next_ip lookup + A record. 'host_record' disabled for WAPI < 2.13
allocate_ipv4: false
allocation_ipv4_network: ""

# New: network auto-create/delete control for explicit IP ingestion (serverInstanceRecordSet)
# When true: create missing required networks and delete networks whose status indicates removal.
# When false: do not create or delete automatically (missing required causes failure; requested deletions are ignored).
autoCreateAndDeleteNetworks: true

# Comment templates for created IP records
# Use literal token placeholders (double square brackets) so Jinja does not pre-render them.
# These tokens are replaced at record creation time inside task logic.
ip_record_comment_template: "MetalSoft server ID: [[SERVER_ID]] | MetalSoft logical network ID: [[LOGICAL_NETWORK_ID]]"

# Manual deletion override controls
ms_force_delete: false               # when true, all records in input coerced to deleting
force_delete_names: []               # list of record names (FQDN) to coerce to deleting (exact match, trailing dot optional)
delete_active: false                 # when true, treat all active records as deletion candidates (testing / emergency cleanup)

# Role version (bump when making behavioral changes). Helps verify the correct role copy is executing.
infoblox_role_version: "0.1.0-dev-20250927a"

# Enable last-resort direct WAPI deletion if module-based deletion leaves records behind.
ms_direct_delete_fallback: true

# Default domain suffix for synthesized server instance records (used when zone not provided)
serverRecordsDomain: ".example.invalid"

# Host record feature flags
# When true, create/update/delete consolidated Infoblox host records instead of separate A/AAAA records
use_host_records: true
# When true (and use_host_records true), attempt to enable PTR (configure_for_dns) for host record IP entries
host_record_ptr_enabled: true
