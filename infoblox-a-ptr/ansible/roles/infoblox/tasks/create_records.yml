---
# Create/Update non-PTR records in Infoblox
- name: Prepare active non-PTR records
  ansible.builtin.set_fact:
    _active_records: "{{ working_operation.records | selectattr('status','equalto','active') | selectattr('type','defined') | selectattr('type','ne','PTR') | list }}"
- name: Create host records (host mode enabled)
  vars:
    record_fqdn: >-
      {% set base = (item.name | default('@')) %}
      {% if base == '@' %}
      {{ zone_name.rstrip('.') }}
      {% elif base.endswith('.') %}
      {{ base.rstrip('.') }}
      {% else %}
      {{ base + '.' + zone_name.rstrip('.') }}
      {% endif %}
  loop: "{{ _active_records }}"
  loop_control:
    label: "HOST {{ item.name }}"
  when:
    - use_host_records | default(false) | bool
    - item.type | upper in ['A','AAAA']
  ansible.builtin.include_tasks: _create_host_record_task.yml

- name: Create A/AAAA records (legacy mode)
  vars:
    record_fqdn: >-
      {% set base = (item.name | default('@')) %}
      {% if base == '@' %}
      {{ zone_name.rstrip('.') }}
      {% elif base.endswith('.') %}
      {{ base.rstrip('.') }}
      {% else %}
      {{ base + '.' + zone_name.rstrip('.') }}
      {% endif %}
  loop: "{{ _active_records }}"
  loop_control:
    label: "REC {{ item.name }}"
  when:
    - not (use_host_records | default(false) | bool)
    - item.type | upper in ['A','AAAA']
  ansible.builtin.include_tasks: _create_ip_record_task.yml

- name: Debug existing A records before potential deletion (verbosity 1)
  when: ansible_verbosity | int >= 1
  vars:
    _del_names: "{{ working_operation.records | selectattr('status','equalto','deleting') | selectattr('type','equalto','A') | map(attribute='name') | list }}"
  block:
    - name: Query each A record candidate (pre-delete)
      when: _del_names | length > 0
      loop: "{{ _del_names }}"
      loop_control:
        loop_var: del_name
        label: "pre-delete {{ del_name }}"
      ansible.builtin.uri:
        url: "https://{{ infoblox_host }}/wapi/v{{ infoblox_wapi_version }}/record:a?name={{ (del_name.rstrip('.') ) | urlencode }}&view={{ infoblox_view | urlencode }}&_return_fields=name,ipv4addr&_max_results=20"
        method: GET
        user: "{{ infoblox_username }}"
        password: "{{ infoblox_password }}"
        force_basic_auth: true
        validate_certs: "{{ infoblox_validate_certs }}"
        return_content: true
      register: _predelete_a_results
      failed_when: false

    - name: Show pre-delete A record query results
      when: _predelete_a_results is defined
      ansible.builtin.debug:
        var: _predelete_a_results.results | map(attribute='json') | list

- name: Ensure CNAME records
  vars:
    record_fqdn: >-
      {% set base = (item.name | default('@')) %}
      {% if base == '@' %}
      {{ zone_name.rstrip('.') }}
      {% elif base.endswith('.') %}
      {{ base.rstrip('.') }}
      {% else %}
      {{ base + '.' + zone_name.rstrip('.') }}
      {% endif %}
    target: "{{ (item.records[0] | default('')) | trim }}"
  when: item.type | upper == 'CNAME' and item.records is defined and (item.records | length) > 0
  loop: "{{ _active_records }}"
  loop_control:
    label: "CNAME {{ item.name }}"
  infoblox.nios_modules.nios_cname_record:
    name: "{{ record_fqdn | trim }}"
    canonical: "{{ target if target.endswith('.') else target + '.' }}"
    view: "{{ infoblox_view }}"
    ttl: "{{ item.ttl | default(default_ttl) }}"
    state: present
    provider: "{{ nios_provider }}"

- name: Ensure TXT records
  vars:
    record_fqdn: >-
      {% set base = (item.name | default('@')) %}
      {% if base == '@' %}
      {{ zone_name.rstrip('.') }}
      {% elif base.endswith('.') %}
      {{ base.rstrip('.') }}
      {% else %}
      {{ base + '.' + zone_name.rstrip('.') }}
      {% endif %}
  when: item.type | upper == 'TXT' and item.records is defined and (item.records | length) > 0
  loop: "{{ _active_records }}"
  loop_control:
    label: "TXT {{ item.name }}"
  infoblox.nios_modules.nios_txt_record:
    name: "{{ record_fqdn | trim }}"
    text: "{{ item.records | map('trim') | list }}"
    view: "{{ infoblox_view }}"
    ttl: "{{ item.ttl | default(default_ttl) }}"
    state: present
    provider: "{{ nios_provider }}"

