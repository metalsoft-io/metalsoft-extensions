---
- name: Build FQDN for A record
  ansible.builtin.set_fact:
    _auto_ptr_fqdn: >-
      {% if a_record.name == '@' %}{{ zone_name.rstrip('.') }}{% elif a_record.name.endswith('.') %}{{ a_record.name.rstrip('.') }}{% else %}{{ a_record.name + '.' + zone_name.rstrip('.') }}{% endif %}

- name: Initialize PTR deletion candidate IP list
  ansible.builtin.set_fact:
    _auto_ptr_candidate_ips: "{{ a_record.records | default([]) }}"

- name: Discover A record IPs for PTR cleanup when missing or AUTO
  when:
    - (_auto_ptr_candidate_ips | length == 0) or ('AUTO' in _auto_ptr_candidate_ips)
  ansible.builtin.uri:
    url: "https://{{ infoblox_host }}/wapi/v{{ infoblox_wapi_version }}/record:a?name={{ (_auto_ptr_fqdn | trim) | urlencode }}&view={{ infoblox_view | urlencode }}&_return_fields=name,ipv4addr"
    method: GET
    user: "{{ infoblox_username }}"
    password: "{{ infoblox_password }}"
    force_basic_auth: true
    validate_certs: "{{ infoblox_validate_certs }}"
    return_content: true
  register: _auto_ptr_existing_a
  failed_when: false

- name: Consolidate discovered IPs for PTR deletion
  when:
    - _auto_ptr_existing_a.json is defined
    - (_auto_ptr_candidate_ips | length == 0) or ('AUTO' in _auto_ptr_candidate_ips)
  ansible.builtin.set_fact:
    _auto_ptr_candidate_ips: >-
      {{ (_auto_ptr_existing_a.json | map(attribute='ipv4addr') | list)
          if (_auto_ptr_existing_a.json is sequence)
          else [] }}

- name: Debug PTR deletion candidates
  when: ansible_verbosity | int >= 1
  ansible.builtin.debug:
    msg:
      fqdn: "{{ _auto_ptr_fqdn }}"
      original_records: "{{ a_record.records | default([]) }}"
      candidate_ips: "{{ _auto_ptr_candidate_ips | default([]) }}"

- name: Delete autogenerated PTR records for each discovered IP of {{ a_record.name }}
  include_tasks: delete_ptr_for_ip.yml
  loop: "{{ _auto_ptr_candidate_ips | default([]) }}"
  loop_control:
    loop_var: ip_address
    label: "Delete PTR {{ ip_address }}"
  when: ip_address is ansible.utils.ipv4
  vars:
    ptr_record_value: "{{ a_record.name }}.{{ zone_name.rstrip('.') }}"
