---
# Delete non-PTR records in Infoblox
- name: Prepare deleting non-PTR records
  ansible.builtin.set_fact:
    _deleting_records: >-
      {{ working_operation.records | selectattr('status','equalto','deleting') | selectattr('type','defined') | selectattr('type','ne','PTR') | list }}

- name: Delete A/AAAA or Host records
  vars:
    record_fqdn: >-
      {% set base = (item.name | default('@')) %}
      {% if base == '@' %}
      {{ zone_name.rstrip('.') }}
      {% elif base.endswith('.') %}
      {{ base.rstrip('.') }}
      {% else %}
      {{ base + '.' + zone_name.rstrip('.') }}
      {% endif %}
  when: item.type | upper in ['A','AAAA']
  loop: "{{ _deleting_records }}"
  loop_control:
    label: "{{ (use_host_records | default(false) | bool) | ternary('HOST-DEL','REC-DEL') }} {{ item.name }}"
  block:
    - name: Delete host record when host mode enabled
      when: use_host_records | default(false) | bool
      ansible.builtin.include_tasks: _delete_host_record_task.yml

    - name: Delete traditional A/AAAA record when host mode disabled
      when: not (use_host_records | default(false) | bool)
      ansible.builtin.include_tasks: _delete_ip_record_task.yml

# Requery any remaining A/AAAA records for diagnostics
- name: Requery remaining A records (post-delete)
  when: _deleting_records | selectattr('type','defined') | selectattr('type','in',['A','AAAA']) | list | length > 0
  ansible.builtin.uri:
    url: "https://{{ infoblox_host }}/wapi/v{{ infoblox_wapi_version }}/record:a?name={{ ( (item.name if item.name.endswith('.') else item.name + '.' + zone_name.rstrip('.') ) | trim ) | urlencode }}&view={{ infoblox_view | urlencode }}&_return_fields=name,ipv4addr"
    method: GET
    user: "{{ infoblox_username }}"
    password: "{{ infoblox_password }}"
    force_basic_auth: true
    validate_certs: "{{ infoblox_validate_certs }}"
    return_content: true
  register: _post_delete_a_queries
  loop: "{{ _deleting_records | selectattr('type','in',['A']) | list }}"
  loop_control:
    label: "A {{ item.name }}"
  failed_when: false

- name: Requery remaining AAAA records (post-delete)
  when: _deleting_records | selectattr('type','defined') | selectattr('type','in',['A','AAAA']) | list | length > 0
  ansible.builtin.uri:
    url: "https://{{ infoblox_host }}/wapi/v{{ infoblox_wapi_version }}/record:aaaa?name={{ ( (item.name if item.name.endswith('.') else item.name + '.' + zone_name.rstrip('.') ) | trim ) | urlencode }}&view={{ infoblox_view | urlencode }}&_return_fields=name,ipv6addr"
    method: GET
    user: "{{ infoblox_username }}"
    password: "{{ infoblox_password }}"
    force_basic_auth: true
    validate_certs: "{{ infoblox_validate_certs }}"
    return_content: true
  register: _post_delete_aaaa_queries
  loop: "{{ _deleting_records | selectattr('type','in',['AAAA']) | list }}"
  loop_control:
    label: "AAAA {{ item.name }}"
  failed_when: false

- name: Summarize remaining IP record presence
  when: ansible_verbosity | int >= 1
  ansible.builtin.set_fact:
    ms_remaining_a_records: >-
      {{ _post_delete_a_queries.results | map(attribute='json') | list if (_post_delete_a_queries is defined and _post_delete_a_queries.results is defined) else [] }}
    ms_remaining_aaaa_records: >-
      {{ _post_delete_aaaa_queries.results | map(attribute='json') | list if (_post_delete_aaaa_queries is defined and _post_delete_aaaa_queries.results is defined) else [] }}

- name: Debug remaining IP records after module deletion
  when: ansible_verbosity | int >= 1
  ansible.builtin.debug:
    msg:
      remaining_a: "{{ ms_remaining_a_records }}"
      remaining_aaaa: "{{ ms_remaining_aaaa_records }}"

## Direct WAPI deletion fallback (A records)
- name: Fetch A record _refs for fallback delete
  when: ms_direct_delete_fallback | bool and (ms_remaining_a_records | default([]) | length) > 0
  vars:
    _a_item_name: "{{ (item.item.name | default('')) if (item.item is defined) else '' }}"
    _a_effective_name: >-
      {{ (_a_item_name.endswith('.') and _a_item_name.rstrip('.') or (_a_item_name + '.' + zone_name.rstrip('.'))) if (_a_item_name | length) > 0 else zone_name.rstrip('.') }}
  ansible.builtin.uri:
    url: "https://{{ infoblox_host }}/wapi/v{{ infoblox_wapi_version }}/record:a?name={{ (_a_effective_name | trim) | urlencode }}&view={{ infoblox_view | urlencode }}&_return_fields=name,ipv4addr,_ref"
    method: GET
    user: "{{ infoblox_username }}"
    password: "{{ infoblox_password }}"
    force_basic_auth: true
    validate_certs: "{{ infoblox_validate_certs }}"
    return_content: true
  register: _fallback_a_refs
  loop: "{{ _post_delete_a_queries.results | default([]) }}"
  loop_control:
    label: "A-ref {{ item.item.name | default('unknown') }}"
  failed_when: false

- name: Flatten A _ref records for fallback deletion
  when: ms_direct_delete_fallback | bool and (_fallback_a_refs.results | default([]) | length) > 0
  ansible.builtin.set_fact:
    _fallback_a_records_flat: >-
      {{ (
          _fallback_a_refs.results | default([])
          | selectattr('json','defined')
          | map(attribute='json') | list
          | map('list') | list
          | sum(start=[])
        ) | selectattr('_ref','defined') | list }}

- name: Delete remaining A records via direct WAPI (flattened)
  when: ms_direct_delete_fallback | bool and (_fallback_a_records_flat | default([]) | length) > 0
  ansible.builtin.uri:
    url: "https://{{ infoblox_host }}/wapi/v{{ infoblox_wapi_version }}/{{ item._ref }}"
    method: DELETE
    user: "{{ infoblox_username }}"
    password: "{{ infoblox_password }}"
    force_basic_auth: true
    validate_certs: "{{ infoblox_validate_certs }}"
    return_content: true
  loop: "{{ _fallback_a_records_flat }}"
  loop_control:
    label: "A-del {{ (item.name | default('')) }}"
  failed_when: false

## Direct WAPI deletion fallback (AAAA records)
- name: Fetch AAAA record _refs for fallback delete
  when: ms_direct_delete_fallback | bool and (ms_remaining_aaaa_records | default([]) | length) > 0
  vars:
    _aaaa_item_name: "{{ (item.item.name | default('')) if (item.item is defined) else '' }}"
    _aaaa_effective_name: >-
      {{ (_aaaa_item_name.endswith('.') and _aaaa_item_name.rstrip('.') or (_aaaa_item_name + '.' + zone_name.rstrip('.'))) if (_aaaa_item_name | length) > 0 else zone_name.rstrip('.') }}
  ansible.builtin.uri:
    url: "https://{{ infoblox_host }}/wapi/v{{ infoblox_wapi_version }}/record:aaaa?name={{ (_aaaa_effective_name | trim) | urlencode }}&view={{ infoblox_view | urlencode }}&_return_fields=name,ipv6addr,_ref"
    method: GET
    user: "{{ infoblox_username }}"
    password: "{{ infoblox_password }}"
    force_basic_auth: true
    validate_certs: "{{ infoblox_validate_certs }}"
    return_content: true
  register: _fallback_aaaa_refs
  loop: "{{ _post_delete_aaaa_queries.results | default([]) }}"
  loop_control:
    label: "AAAA-ref {{ item.item.name | default('unknown') }}"
  failed_when: false

- name: Flatten AAAA _ref records for fallback deletion
  when: ms_direct_delete_fallback | bool and (_fallback_aaaa_refs.results | default([]) | length) > 0
  ansible.builtin.set_fact:
    _fallback_aaaa_records_flat: >-
      {{ (
          _fallback_aaaa_refs.results | default([])
          | selectattr('json','defined')
          | map(attribute='json') | list
          | map('list') | list
          | sum(start=[])
        ) | selectattr('_ref','defined') | list }}

- name: Delete remaining AAAA records via direct WAPI (flattened)
  when: ms_direct_delete_fallback | bool and (_fallback_aaaa_records_flat | default([]) | length) > 0
  ansible.builtin.uri:
    url: "https://{{ infoblox_host }}/wapi/v{{ infoblox_wapi_version }}/{{ item._ref }}"
    method: DELETE
    user: "{{ infoblox_username }}"
    password: "{{ infoblox_password }}"
    force_basic_auth: true
    validate_certs: "{{ infoblox_validate_certs }}"
    return_content: true
  loop: "{{ _fallback_aaaa_records_flat }}"
  loop_control:
    label: "AAAA-del {{ (item.name | default('')) }}"
  failed_when: false

- name: Final requery A after fallback
  when: ms_direct_delete_fallback | bool and ((ms_remaining_a_records | default([]) | length) > 0)
  ansible.builtin.uri:
    url: "https://{{ infoblox_host }}/wapi/v{{ infoblox_wapi_version }}/record:a?name={{ ( (item.name if item.name.endswith('.') else item.name + '.' + zone_name.rstrip('.') ) | trim ) | urlencode }}&view={{ infoblox_view | urlencode }}&_return_fields=name,ipv4addr"
    method: GET
    user: "{{ infoblox_username }}"
    password: "{{ infoblox_password }}"
    force_basic_auth: true
    validate_certs: "{{ infoblox_validate_certs }}"
    return_content: true
  register: _final_a_requery
  loop: "{{ _deleting_records | selectattr('type','equalto','A') | list }}"
  loop_control:
    label: "A-final {{ item.name }}"
  failed_when: false

- name: Final requery AAAA after fallback
  when: ms_direct_delete_fallback | bool and ((ms_remaining_aaaa_records | default([]) | length) > 0)
  ansible.builtin.uri:
    url: "https://{{ infoblox_host }}/wapi/v{{ infoblox_wapi_version }}/record:aaaa?name={{ ( (item.name if item.name.endswith('.') else item.name + '.' + zone_name.rstrip('.') ) | trim ) | urlencode }}&view={{ infoblox_view | urlencode }}&_return_fields=name,ipv6addr"
    method: GET
    user: "{{ infoblox_username }}"
    password: "{{ infoblox_password }}"
    force_basic_auth: true
    validate_certs: "{{ infoblox_validate_certs }}"
    return_content: true
  register: _final_aaaa_requery
  loop: "{{ _deleting_records | selectattr('type','equalto','AAAA') | list }}"
  loop_control:
    label: "AAAA-final {{ item.name }}"
  failed_when: false

- name: Debug final presence after fallback
  when: ansible_verbosity | int >= 1 and ms_direct_delete_fallback | bool
  ansible.builtin.debug:
    msg:
      final_a_records: "{{ _final_a_requery.results | map(attribute='json') | list if (_final_a_requery is defined) else [] }}"
      final_aaaa_records: "{{ _final_aaaa_requery.results | map(attribute='json') | list if (_final_aaaa_requery is defined) else [] }}"

- name: Delete CNAME records
  vars:
    record_fqdn: >-
      {% set base = (item.name | default('@')) %}
      {% if base == '@' %}
      {{ zone_name.rstrip('.') }}
      {% elif base.endswith('.') %}
      {{ base.rstrip('.') }}
      {% else %}
      {{ base + '.' + zone_name.rstrip('.') }}
      {% endif %}
  when: item.type | upper == 'CNAME'
  loop: "{{ _deleting_records }}"
  loop_control:
    label: "CNAME {{ item.name }}"
  infoblox.nios_modules.nios_cname_record:
    name: "{{ record_fqdn | trim }}"
    view: "{{ infoblox_view }}"
    state: absent
    provider: "{{ nios_provider }}"

- name: Delete TXT records
  vars:
    record_fqdn: >-
      {% set base = (item.name | default('@')) %}
      {% if base == '@' %}
      {{ zone_name.rstrip('.') }}
      {% elif base.endswith('.') %}
      {{ base.rstrip('.') }}
      {% else %}
      {{ base + '.' + zone_name.rstrip('.') }}
      {% endif %}
  when: item.type | upper == 'TXT'
  loop: "{{ _deleting_records }}"
  loop_control:
    label: "TXT {{ item.name }}"
  infoblox.nios_modules.nios_txt_record:
    name: "{{ record_fqdn | trim }}"
    view: "{{ infoblox_view }}"
    state: absent
    provider: "{{ nios_provider }}"
