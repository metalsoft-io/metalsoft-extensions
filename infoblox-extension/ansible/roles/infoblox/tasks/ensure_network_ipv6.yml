# Ensure single IPv6 network exists (target_cidr_v6 provided by caller loop)

- name: Query IPv6 network {{ target_cidr_v6 }} (object 'ipv6network')
  ansible.builtin.uri:
    url: "https://{{ infoblox_host }}/wapi/v{{ infoblox_wapi_version }}/ipv6network?network={{ target_cidr_v6 | urlencode }}&_return_fields=network"
    method: GET
    user: "{{ infoblox_username }}"
    password: "{{ infoblox_password }}"
    force_basic_auth: true
    validate_certs: "{{ infoblox_validate_certs }}"
    return_content: true
  register: _net6_query
  failed_when: false

- name: Determine if IPv6 network {{ target_cidr_v6 }} present
  ansible.builtin.set_fact:
    _net6_present: >-
      {{ (_net6_query.status | default(0)) == 200 and (
          (_net6_query.json is mapping and ('network' in _net6_query.json) )
          or (
            _net6_query.json is sequence and (
              _net6_query.json | selectattr('network','defined') | selectattr('network','equalto', target_cidr_v6) | list | length
            ) > 0
          )
        ) }}

- name: Create IPv6 network {{ target_cidr_v6 }} if missing and allowed
  when: (not _net6_present) and autoCreateAndDeleteNetworks | bool
  ansible.builtin.uri:
    url: "https://{{ infoblox_host }}/wapi/v{{ infoblox_wapi_version }}/ipv6network"
    method: POST
    user: "{{ infoblox_username }}"
    password: "{{ infoblox_password }}"
    force_basic_auth: true
    validate_certs: "{{ infoblox_validate_certs }}"
    headers:
      Content-Type: application/json
    body_format: json
    body:
      network: "{{ target_cidr_v6 }}"
      comment: "MetalSoft Logical Network ID: {{ ms_network_logical_id_map_v6[target_cidr_v6] | default('unknown') }}"
    return_content: true
  register: _net6_create
  failed_when: false

- name: Record IPv6 network ensure outcome {{ target_cidr_v6 }}
  ansible.builtin.set_fact:
    ms_network_results_v6: >-
      {{ (ms_network_results_v6 | default([])) + [ {
          'cidr': target_cidr_v6,
          'get_status': _net6_query.status | default('n/a'),
          'present_pre': _net6_present,
          'create_status': _net6_create.status | default('n/a'),
          'created': (_net6_create.status | default(0)) in [200,201],
          'final_status': (_net6_present | bool) and 'present' or (((_net6_create.status | default(0)) in [200,201]) and 'created' or 'missing')
        } ] }}

- name: Debug ensure IPv6 network {{ target_cidr_v6 }} (verbosity >=2)
  when: ansible_verbosity | int >= 2
  ansible.builtin.debug:
    msg:
      cidr: "{{ target_cidr_v6 }}"
      get_status: "{{ _net6_query.status | default('n/a') }}"
      get_json: "{{ _net6_query.json | default({}) }}"
      net_present_pre: "{{ _net6_present }}"
      create_status: "{{ _net6_create.status | default('n/a') }}"