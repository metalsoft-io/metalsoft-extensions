# prettier-ignore-file
# yamllint disable
---
# Detect which JSON format
- name: Detect JSON format type
  ansible.builtin.set_fact:
    # Check if it's instance group format
    is_instance_group: >-
      {{
      (
        dns_operation.serverInstanceGroupDNSRecordSet is defined
        and dns_operation.serverInstanceGroupDNSRecordSet.records is defined
        and (dns_operation.serverInstanceGroupDNSRecordSet.records | length > 0)
      )
      }}
    # Check if it's single instance format
    is_instance: >-
      {{
      (
        dns_operation.serverInstanceDNSRecordSet is defined
        and dns_operation.serverInstanceDNSRecordSet.records is defined
        and (dns_operation.serverInstanceDNSRecordSet.records | length > 0)
      )
      }}
    # Check if it's cluster format
    is_cluster: >-
      {{
      (
        dns_operation.clusterDNSRecordSet is defined
        and dns_operation.clusterDNSRecordSet.records is defined
        and (dns_operation.clusterDNSRecordSet.records | length > 0)
      )
      }}
    # Check if it's server format (physical server management)
    is_server: "{{ dns_operation.serverDNSRecordSet is defined }}"
    # Check if it's switch format (network switch management)
    is_switch: "{{ dns_operation.switchDNSRecordSet is defined }}"
    # New: serverInstanceRecordSet format (multiple NIC IP inventory separate from DNS records)
    is_server_instance_record: "{{ dns_operation.serverInstanceRecordSet is defined }}"

# Show role version early for troubleshooting (ensures correct role content loaded)
- name: Debug role version
  ansible.builtin.debug:
    msg: "Infoblox role version: {{ infoblox_role_version }}"

# Ensure core mapping variables exist to prevent undefined errors in record comment templates
- name: Initialize safe defaults for logical network variables
  ansible.builtin.set_fact:
    ms_logical_network_ids: "{{ ms_logical_network_ids | default([]) }}"
    ms_ip_logical_map: "{{ ms_ip_logical_map | default({}) }}"

# Sentinel fail: if the role version variable is missing, this is almost certainly an OLD/STALE role copy.
# (In the maintained repo, defaults/main.yml defines infoblox_role_version.)
- name: Fail if role version variable missing (stale role copy?)
  ansible.builtin.fail:
    msg: >-
      infoblox_role_version is undefined: this indicates a stale/old role copy is being executed.
      Ensure you run the playbook from the updated repository directory (not /private/tmp) or sync the role.
  when: infoblox_role_version is not defined

# Detect management address type for servers
- name: Analyze management address type for servers
  when: is_server
  ansible.builtin.set_fact:
    mgmt_is_ipv4: "{{ dns_operation.serverDNSRecordSet.managementAddress | regex_search('^[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}$') }}"
    mgmt_is_ipv6: "{{ ':' in dns_operation.serverDNSRecordSet.managementAddress }}"
    mgmt_is_hostname: "{{ not (dns_operation.serverDNSRecordSet.managementAddress | regex_search('^[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}$')) and ':' not in dns_operation.serverDNSRecordSet.managementAddress }}"

# Detect management address type for switches
- name: Analyze management address type for switches
  when: is_switch
  ansible.builtin.set_fact:
    mgmt_is_ipv4: "{{ dns_operation.switchDNSRecordSet.managementAddress | regex_search('^[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}$') }}"
    mgmt_is_ipv6: "{{ ':' in dns_operation.switchDNSRecordSet.managementAddress }}"
    mgmt_is_hostname: "{{ not (dns_operation.switchDNSRecordSet.managementAddress | regex_search('^[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}$')) and ':' not in dns_operation.switchDNSRecordSet.managementAddress }}"

# Transform instance group format
- name: Transform instance group format
  when: is_instance_group
  ansible.builtin.set_fact:
    transformed_operation:
      zone: "{{ dns_operation.serverInstanceGroupDNSRecordSet.zone.zoneName }}"
      nameservers: "{{ dns_operation.serverInstanceGroupDNSRecordSet.zone.nameServers }}"
      records: "{{ dns_operation.serverInstanceGroupDNSRecordSet.records }}"
      soa_email: "{{ dns_operation.serverInstanceGroupDNSRecordSet.zone.soaEmail }}"

- name: Convert instance group records to deleting when operation delete
  when: is_instance_group and (dns_operation.serverInstanceGroupDNSRecordSet.operation | default('') | lower) == 'delete'
  ansible.builtin.set_fact:
    transformed_operation: >-
      {{ transformed_operation | combine({ 'records': (transformed_operation.records | map('combine', {'status': 'deleting'}) | list) }, recursive=True) }}

# Transform instance format
- name: Transform instance format
  when: is_instance
  ansible.builtin.set_fact:
    transformed_operation:
      zone: "{{ dns_operation.serverInstanceDNSRecordSet.zone.zoneName }}"
      nameservers: "{{ dns_operation.serverInstanceDNSRecordSet.zone.nameServers }}"
      records: "{{ dns_operation.serverInstanceDNSRecordSet.records }}"
      soa_email: "{{ dns_operation.serverInstanceDNSRecordSet.zone.soaEmail }}"

- name: Convert instance records to deleting when operation delete
  when: is_instance and (dns_operation.serverInstanceDNSRecordSet.operation | default('') | lower) == 'delete'
  ansible.builtin.set_fact:
    transformed_operation: >-
      {{ transformed_operation | combine({ 'records': (transformed_operation.records | map('combine', {'status': 'deleting'}) | list) }, recursive=True) }}

# Transform instance format
- name: Transform cluster format
  when: is_cluster
  ansible.builtin.set_fact:
    transformed_operation:
      zone: "{{ dns_operation.clusterDNSRecordSet.zone.zoneName }}"
      nameservers: "{{ dns_operation.clusterDNSRecordSet.zone.nameServers }}"
      records: "{{ dns_operation.clusterDNSRecordSet.records }}"
      soa_email: "{{ dns_operation.clusterDNSRecordSet.zone.soaEmail }}"

- name: Convert cluster records to deleting when operation delete
  when: is_cluster and (dns_operation.clusterDNSRecordSet.operation | default('') | lower) == 'delete'
  ansible.builtin.set_fact:
    transformed_operation: >-
      {{ transformed_operation | combine({ 'records': (transformed_operation.records | map('combine', {'status': 'deleting'}) | list) }, recursive=True) }}

# Transform server format (physical servers)
- name: Transform server format
  when: is_server
  ansible.builtin.set_fact:
    transformed_operation:
      zone: "{{ dns_operation.serverDNSRecordSet.zone.zoneName }}"
      nameservers: "{{ dns_operation.serverDNSRecordSet.zone.nameServers }}"
      records: >-
        {%- if dns_operation.serverDNSRecordSet.operation == 'delete' -%}
          {{ [
            {'name': dns_operation.serverDNSRecordSet.hostname, 'status': 'deleting', 'type': 'A', 'ptr': 'enabled', 'records': [dns_operation.serverDNSRecordSet.ip.ip] if dns_operation.serverDNSRecordSet.ip.ip is defined else []},
            {'name': dns_operation.serverDNSRecordSet.hostname, 'status': 'deleting', 'type': 'AAAA'},
            {'name': dns_operation.serverDNSRecordSet.hostname, 'status': 'deleting', 'type': 'CNAME'}
          ] }}
        {%- else -%}
          {%- if mgmt_is_ipv6 -%}
            {{ [{'name': dns_operation.serverDNSRecordSet.hostname, 'status': 'active', 'type': 'AAAA', 'records': [dns_operation.serverDNSRecordSet.managementAddress] if dns_operation.serverDNSRecordSet.ip.status == 'allocated' else [], 'ttl': dns_operation.serverDNSRecordSet.zone.ttl | default(3600)}] }}
          {%- elif mgmt_is_ipv4 -%}
            {{ [{'name': dns_operation.serverDNSRecordSet.hostname, 'status': 'active', 'type': 'A', 'ptr': 'enabled', 'records': [dns_operation.serverDNSRecordSet.managementAddress] if dns_operation.serverDNSRecordSet.ip.status == 'allocated' else [], 'ttl': dns_operation.serverDNSRecordSet.zone.ttl | default(3600)}] }}
          {%- else -%}
            {{ [{'name': dns_operation.serverDNSRecordSet.hostname, 'status': 'active', 'type': 'CNAME', 'records': [dns_operation.serverDNSRecordSet.managementAddress], 'ttl': dns_operation.serverDNSRecordSet.zone.ttl | default(3600)}] }}
          {%- endif -%}
        {%- endif -%}
      infrastructure_id: "{{ dns_operation.serverDNSRecordSet.serverId }}"
      soa_email: "{{ dns_operation.serverDNSRecordSet.zone.soaEmail }}"

# Transform switch format (network switches)
- name: Transform switch format
  when: is_switch
  ansible.builtin.set_fact:
    transformed_operation:
      zone: "{{ dns_operation.switchDNSRecordSet.zone.zoneName }}"
      nameservers: "{{ dns_operation.switchDNSRecordSet.zone.nameServers }}"
      records: >-
        {%- if dns_operation.switchDNSRecordSet.operation == 'delete' -%}
          {{ [
            {'name': dns_operation.switchDNSRecordSet.hostname, 'status': 'deleting', 'type': 'A', 'ptr': 'enabled', 'records': [dns_operation.switchDNSRecordSet.ip.ip] if dns_operation.switchDNSRecordSet.ip.ip is defined else []},
            {'name': dns_operation.switchDNSRecordSet.hostname, 'status': 'deleting', 'type': 'AAAA'},
            {'name': dns_operation.switchDNSRecordSet.hostname, 'status': 'deleting', 'type': 'CNAME'}
          ] }}
        {%- else -%}
          {%- if mgmt_is_ipv6 -%}
            {{ [{'name': dns_operation.switchDNSRecordSet.hostname, 'status': 'active', 'type': 'AAAA', 'records': [dns_operation.switchDNSRecordSet.managementAddress] if dns_operation.switchDNSRecordSet.ip.status == 'allocated' else [], 'ttl': dns_operation.switchDNSRecordSet.zone.ttl | default(3600)}] }}
          {%- elif mgmt_is_ipv4 -%}
            {{ [{'name': dns_operation.switchDNSRecordSet.hostname, 'status': 'active', 'type': 'A', 'ptr': 'enabled', 'records': [dns_operation.switchDNSRecordSet.managementAddress] if dns_operation.switchDNSRecordSet.ip.status == 'allocated' else [], 'ttl': dns_operation.switchDNSRecordSet.zone.ttl | default(3600)}] }}
          {%- else -%}
            {{ [{'name': dns_operation.switchDNSRecordSet.hostname, 'status': 'active', 'type': 'CNAME', 'records': [dns_operation.switchDNSRecordSet.managementAddress], 'ttl': dns_operation.switchDNSRecordSet.zone.ttl | default(3600)}] }}
          {%- endif -%}
        {%- endif -%}
      infrastructure_id: "{{ dns_operation.switchDNSRecordSet.switchId }}"
      soa_email: "{{ dns_operation.switchDNSRecordSet.zone.soaEmail }}"

# Transform serverInstanceRecordSet format into DNS A records (and future AAAA)
- name: Transform serverInstanceRecordSet format
  when: is_server_instance_record
  ansible.builtin.set_fact:
    transformed_operation: >-
      {{ {
          'zone': (dns_operation.serverInstanceRecordSet.zone.zoneName if (dns_operation.serverInstanceRecordSet.zone is defined and dns_operation.serverInstanceRecordSet.zone.zoneName is defined) else dns_operation.serverInstanceRecordSet.siteLabel ~ serverRecordsDomain),
          'nameservers': (dns_operation.serverInstanceRecordSet.zone.nameServers if (dns_operation.serverInstanceRecordSet.zone is defined and dns_operation.serverInstanceRecordSet.zone.nameServers is defined) else []),
          'soa_email': (dns_operation.serverInstanceRecordSet.zone.soaEmail if (dns_operation.serverInstanceRecordSet.zone is defined and dns_operation.serverInstanceRecordSet.zone.soaEmail is defined) else 'admin.' ~ (dns_operation.serverInstanceRecordSet.siteLabel | default('local')) ~ serverRecordsDomain),
          'records': (
              (
                dns_operation.serverInstanceRecordSet.instanceIpv4Ips | map('extract', attribute='ip')
              ) if false else []
          )
        } }}

- name: Build DNS records from serverInstanceRecordSet IPs
  when: is_server_instance_record
  vars:
    _ipv4_list: "{{ (dns_operation.serverInstanceRecordSet.instanceIpv4Ips | default([])) | map(attribute='ip') | list }}"
    _ipv6_list: "{{ (dns_operation.serverInstanceRecordSet.instanceIpv6Ips | default([])) | map(attribute='ip') | list }}"
  ansible.builtin.set_fact:
    transformed_operation: >-
      {{ transformed_operation | combine({
          'records': (
              [
                {
                  'name': (dns_operation.serverInstanceRecordSet.hostname | default('host-' ~ dns_operation.serverInstanceRecordSet.serverInstanceId)),
                  'status': 'active',
                  'type': 'A',
                  'ptr': 'enabled',
                  'records': _ipv4_list
                }
              ] if (_ipv4_list | length) > 0 else []
            )
            + (
              [
                {
                  'name': (dns_operation.serverInstanceRecordSet.hostname | default('host-' ~ dns_operation.serverInstanceRecordSet.serverInstanceId)),
                  'status': 'active',
                  'type': 'AAAA',
                  'records': _ipv6_list
                }
              ] if (_ipv6_list | length) > 0 else []
            )
        }, recursive=True) }}
  
- name: Append gateway A records
  when: is_server_instance_record and (dns_operation.serverInstanceRecordSet.logicalNetworks is defined)
  block:
    - name: Initialize gateway records list
      ansible.builtin.set_fact:
        _gateway_records: []

    - name: Accumulate gateway gateway records per logical network
      ansible.builtin.set_fact:
        _gateway_records: >-
          {{ _gateway_records + [ {
              'name': 'gw-ln' ~ (item.logicalNetworkId | string),
              'status': 'active',
              'type': 'A',
              'ptr': 'enabled',
              'records': (item.ipv4Subnets | default([]) | selectattr('gateway','defined') | map(attribute='gateway') | list)
            } ] }}
      when: (item.ipv4Subnets | default([]) | selectattr('gateway','defined') | list | length) > 0
      loop: "{{ dns_operation.serverInstanceRecordSet.logicalNetworks }}"
      loop_control:
        label: "ln-{{ item.logicalNetworkId }}"

    - name: Append accumulated gateway records (excluding empty)
      ansible.builtin.set_fact:
        transformed_operation: >-
          {{ transformed_operation | combine({'records': (transformed_operation.records | default([])) + (_gateway_records | rejectattr('records','equalto',[]) | list)}, recursive=True) }}

- name: Extend ms_ip_logical_map with gateway IPs
  when: is_server_instance_record and (dns_operation.serverInstanceRecordSet.logicalNetworks is defined)
  block:
    - name: Initialize gateway ip/lnid pairs
      ansible.builtin.set_fact:
        _gateway_ip_pairs: []

    - name: Accumulate gateway ip/lnid pairs
      ansible.builtin.set_fact:
        _gateway_ip_pairs: >-
          {{ _gateway_ip_pairs + ( item.ipv4Subnets | default([]) | selectattr('gateway','defined') | map(attribute='gateway') | list | zip( ([item.logicalNetworkId]|map('string')|list) * (item.ipv4Subnets | default([]) | selectattr('gateway','defined') | list | length) ) | list ) }}
      loop: "{{ dns_operation.serverInstanceRecordSet.logicalNetworks }}"
      loop_control:
        label: "gw-ln-{{ item.logicalNetworkId }}"

    - name: Merge gateway ip map into ms_ip_logical_map
      ansible.builtin.set_fact:
        ms_ip_logical_map: >-
          {{ ms_ip_logical_map | default({}) | combine( dict(_gateway_ip_pairs) ) }}

- name: Convert serverInstanceRecordSet records to deleting if deployType delete and status ongoing
  when: is_server_instance_record and (dns_operation.serverInstanceRecordSet.deployType | default('') | lower) == 'delete' and (dns_operation.serverInstanceRecordSet.deployStatus | default('') | lower) == 'ongoing'
  ansible.builtin.set_fact:
    transformed_operation: >-
      {{ transformed_operation | combine({
          'records': transformed_operation.records | map('combine', {'status': 'deleting'}) | list
        }, recursive=True) }}

- name: Capture server / logical network IDs for comment usage
  when: is_server_instance_record
  ansible.builtin.set_fact:
    ms_server_id: "{{ dns_operation.serverInstanceRecordSet.serverId | default('') }}"
    # Merge IPv4 and IPv6 logical network IDs (some servers may have only v6 or only v4)
    ms_logical_network_ids: >-
      {{ (
          (dns_operation.serverInstanceRecordSet.instanceIpv4Ips | map(attribute='logicalNetworkId') | list)
          + (dns_operation.serverInstanceRecordSet.instanceIpv6Ips | default([]) | map(attribute='logicalNetworkId') | list)
        ) | select('defined') | list | unique }}
    # Build combined IP -> logicalNetworkId map for both protocol families
    ms_ip_logical_map: >-
      {{ dict(
          (
            (dns_operation.serverInstanceRecordSet.instanceIpv4Ips | map(attribute='ip') | list)
            + (dns_operation.serverInstanceRecordSet.instanceIpv6Ips | default([]) | map(attribute='ip') | list)
          )
          | zip(
            (
              (dns_operation.serverInstanceRecordSet.instanceIpv4Ips | map(attribute='logicalNetworkId') | list)
              + (dns_operation.serverInstanceRecordSet.instanceIpv6Ips | default([]) | map(attribute='logicalNetworkId') | list)
            )
          )
        ) }}
  
# Build required network CIDRs (simplified)
- name: Build required IPv4 CIDRs
  when: is_server_instance_record
  ansible.builtin.set_fact:
    ms_required_ipv4_cidrs: >-
      {{ dns_operation.serverInstanceRecordSet.instanceIpv4Ips | map(attribute='networkAddress') | list
         | zip(dns_operation.serverInstanceRecordSet.instanceIpv4Ips | map(attribute='maskBits') | list)
         | map('join','/') | list | unique }}

# Preflight connectivity check so we treat host-down as distinct from logical absence
- name: Preflight Infoblox connectivity check (serverInstanceRecordSet)
  when: is_server_instance_record
  ansible.builtin.uri:
    url: "https://{{ infoblox_host }}/wapi/v{{ infoblox_wapi_version }}/network?_max_results=1&_return_fields=network"
    method: GET
    user: "{{ infoblox_username }}"
    password: "{{ infoblox_password }}"
    force_basic_auth: true
    validate_certs: "{{ infoblox_validate_certs }}"
    return_content: true
  register: _infoblox_preflight
  failed_when: false

- name: Debug preflight connectivity (verbosity>=1)
  when: is_server_instance_record and (ansible_verbosity | int) >= 1
  ansible.builtin.debug:
    msg:
      preflight_status: "{{ _infoblox_preflight.status | default('n/a') }}"
      preflight_msg: "{{ _infoblox_preflight.msg | default('') }}"
      preflight_json: "{{ _infoblox_preflight.json | default([]) }}"

- name: Fail early if Infoblox unreachable (preflight status -1)
  when: is_server_instance_record and ((_infoblox_preflight.status | default(0)) == -1)
  ansible.builtin.fail:
    msg: >-
      Infoblox WAPI unreachable during preflight (status -1). Message: {{ _infoblox_preflight.msg | default('no message') }}.
      Aborting before attempting network ensure. Investigate connectivity / Infoblox service availability.

- name: Build required IPv6 CIDRs
  when: is_server_instance_record and (dns_operation.serverInstanceRecordSet.instanceIpv6Ips | default([]) | length) > 0
  ansible.builtin.set_fact:
    ms_required_ipv6_cidrs: >-
      {{ dns_operation.serverInstanceRecordSet.instanceIpv6Ips | map(attribute='networkAddress') | list
         | zip(dns_operation.serverInstanceRecordSet.instanceIpv6Ips | map(attribute='maskBits') | list)
         | map('join','/') | list | unique }}

- name: Build network logical ID map
  when: is_server_instance_record
  ansible.builtin.set_fact:
    ms_network_logical_id_map: >-
      {{ dict( dns_operation.serverInstanceRecordSet.instanceIpv4Ips
                 | map(attribute='networkAddress') | list
                 | zip(dns_operation.serverInstanceRecordSet.instanceIpv4Ips | map(attribute='maskBits') | list)
                 | map('join','/') | list
                 | zip(dns_operation.serverInstanceRecordSet.instanceIpv4Ips | map(attribute='logicalNetworkId') | list)) }}

- name: Build IPv6 network logical ID map
  when: is_server_instance_record and (dns_operation.serverInstanceRecordSet.instanceIpv6Ips | default([]) | length) > 0
  ansible.builtin.set_fact:
    ms_network_logical_id_map_v6: >-
      {{ dict( dns_operation.serverInstanceRecordSet.instanceIpv6Ips
                 | map(attribute='networkAddress') | list
                 | zip(dns_operation.serverInstanceRecordSet.instanceIpv6Ips | map(attribute='maskBits') | list)
                 | map('join','/') | list
                 | zip(dns_operation.serverInstanceRecordSet.instanceIpv6Ips | map(attribute='logicalNetworkId') | list)) }}

# Build ms_network_state_items explicitly: one entry per ipv4Subnet with cidr, status, logicalNetworkId
- name: Initialize ms_network_state_items
  when: is_server_instance_record and (dns_operation.serverInstanceRecordSet.logicalNetworks is defined)
  ansible.builtin.set_fact:
    ms_network_state_items: []

- name: Initialize ms_network_state_items_ipv6
  when: is_server_instance_record and (dns_operation.serverInstanceRecordSet.logicalNetworks is defined)
  ansible.builtin.set_fact:
    ms_network_state_items_ipv6: []

- name: Accumulate subnet state items
  when: is_server_instance_record and (dns_operation.serverInstanceRecordSet.logicalNetworks is defined)
  vars:
    _ln: "{{ item }}"
  loop: "{{ dns_operation.serverInstanceRecordSet.logicalNetworks }}"
  loop_control:
    label: "ln-{{ item.logicalNetworkId }}"
  ansible.builtin.set_fact:
    ms_network_state_items: >-
      {{ (ms_network_state_items | default([])) + (
          (_ln.ipv4Subnets | default([])) | map('community.general.json_query', '{cidr: join(`"/"`, [networkAddress, to_string(prefixLength)]), status: status, logicalNetworkId: `'+ (_ln.logicalNetworkId | string) +'`}') | list
        ) }}

- name: Accumulate IPv6 subnet state items
  when: is_server_instance_record and (dns_operation.serverInstanceRecordSet.logicalNetworks is defined)
  vars:
    _ln: "{{ item }}"
  loop: "{{ dns_operation.serverInstanceRecordSet.logicalNetworks }}"
  loop_control:
    label: "ln6-{{ item.logicalNetworkId }}"
  ansible.builtin.set_fact:
    ms_network_state_items_ipv6: >-
      {{ (ms_network_state_items_ipv6 | default([])) + (
          (_ln.ipv6Subnets | default([])) | map('community.general.json_query', '{cidr: join(`"/"`, [networkAddress, to_string(prefixLength)]), status: status, logicalNetworkId: `'+ (_ln.logicalNetworkId | string) +'`}') | list
        ) }}


## Robust network ensure logic (per-CIDR):
- name: Initialize network ensure accumulator
  when: is_server_instance_record
  ansible.builtin.set_fact:
    ms_network_results: []

- name: Initialize IPv6 network ensure accumulator
  when: is_server_instance_record and (ms_required_ipv6_cidrs | default([]) | length) > 0
  ansible.builtin.set_fact:
    ms_network_results_v6: []

- name: Ensure required IPv4 network {{ item }}
  when: is_server_instance_record and (ms_required_ipv4_cidrs | length) > 0
  vars:
    target_cidr: "{{ item }}"
  ansible.builtin.include_tasks: ensure_network.yml
  loop: "{{ ms_required_ipv4_cidrs }}"
  loop_control:
    label: "net-ensure-{{ item }}"

- name: Ensure required IPv6 network {{ item }}
  when: is_server_instance_record and (ms_required_ipv6_cidrs | default([]) | length) > 0
  vars:
    target_cidr_v6: "{{ item }}"
  ansible.builtin.include_tasks: ensure_network_ipv6.yml
  loop: "{{ ms_required_ipv6_cidrs }}"
  loop_control:
    label: "net6-ensure-{{ item }}"

# New: process create/delete for logicalNetworks ipv4Subnets (status governs action)
- name: Process logical network subnet desired state (create/delete)
  when: is_server_instance_record and (ms_network_state_items is defined) and (ms_network_state_items | length) > 0
  block:
    - name: Iterate subnet desired state entries
      ansible.builtin.include_tasks: manage_network_state.yml
      loop: "{{ ms_network_state_items }}"
      loop_control:
        label: "lnet-subnet-{{ item.cidr }}-{{ item.status | default('unknown') }}"

- name: Process logical network IPv6 subnet desired state (create/delete)
  when: is_server_instance_record and (ms_network_state_items_ipv6 is defined) and (ms_network_state_items_ipv6 | length) > 0
  block:
    - name: Iterate IPv6 subnet desired state entries
      ansible.builtin.include_tasks: manage_network_state_ipv6.yml
      loop: "{{ ms_network_state_items_ipv6 }}"
      loop_control:
        label: "lnet6-subnet-{{ item.cidr }}-{{ item.status | default('unknown') }}"

- name: Derive missing networks list
  when: is_server_instance_record
  ansible.builtin.set_fact:
    ms_missing_networks: "{{ ms_network_results | selectattr('final_status','equalto','missing') | map(attribute='cidr') | list }}"

- name: Derive unreachable networks list
  when: is_server_instance_record
  ansible.builtin.set_fact:
    ms_unreachable_networks: "{{ ms_network_results | selectattr('final_status','equalto','unreachable') | map(attribute='cidr') | list }}"

- name: Derive missing IPv6 networks list
  when: is_server_instance_record and (ms_network_results_v6 is defined)
  ansible.builtin.set_fact:
    ms_missing_networks_v6: "{{ ms_network_results_v6 | selectattr('final_status','equalto','missing') | map(attribute='cidr') | list }}"

- name: Fail if networks still missing and autoCreateAndDeleteNetworks disabled or creation not allowed
  when: is_server_instance_record and (ms_missing_networks | length) > 0
  ansible.builtin.fail:
    msg: "Required networks missing in Infoblox: {{ ms_missing_networks }} (autoCreateAndDeleteNetworks={{ autoCreateAndDeleteNetworks }})"

- name: Fail if IPv6 networks still missing and autoCreateAndDeleteNetworks disabled or creation not allowed
  when: is_server_instance_record and (ms_missing_networks_v6 is defined) and (ms_missing_networks_v6 | length) > 0
  ansible.builtin.fail:
    msg: "Required IPv6 networks missing in Infoblox: {{ ms_missing_networks_v6 }} (autoCreateAndDeleteNetworks={{ autoCreateAndDeleteNetworks }})"

- name: Fail if networks unreachable (connectivity issues)
  when: is_server_instance_record and (ms_unreachable_networks | default([]) | length) > 0
  ansible.builtin.fail:
    msg: >-
      Could not verify / ensure networks due to connectivity errors for CIDRs: {{ ms_unreachable_networks }}.
      These were marked 'unreachable' (e.g., status -1). Check network path / Infoblox service health before retrying.

- name: Debug network ensure summary
  when: is_server_instance_record and ansible_verbosity | int >= 1
  ansible.builtin.debug:
    msg: "Network ensure results: {{ ms_network_results }}"

# Now set working_operation after all transformations
- name: Set working operation
  ansible.builtin.set_fact:
    working_operation: "{{ transformed_operation if (is_instance_group or is_instance or is_cluster or is_server or is_switch or is_server_instance_record) else dns_operation }}"

# Helper to check if record has content
- name: Check if there are records to process
  ansible.builtin.set_fact:
    has_records_to_set: >-
      {{
      (
        working_operation.records is defined
        and (working_operation.records | length > 0)
        and (working_operation.records | selectattr('status', 'equalto', 'active') | list | length > 0)
      )
      }}
    has_records_to_delete: >-
      {{
      (
        working_operation.records is defined
        and (working_operation.records | length > 0)
        and (working_operation.records | selectattr('status', 'equalto', 'deleting') | list | length > 0)
      )
      }}

- name: "Sentinel debug - force delete requested but no records currently marked deleting"
  when: ms_force_delete | bool and (not has_records_to_delete) and ansible_verbosity | int >= 0
  ansible.builtin.debug:
    msg:
      warning: "ms_force_delete=true but no records have status=deleting yet (will attempt coercion later). If this persists after coercion step, role copy may be stale."
      current_record_statuses: "{{ (working_operation.records | map(attribute='status') | list) if (working_operation.records is defined) else [] }}"
      record_names: "{{ (working_operation.records | map(attribute='name') | list) if (working_operation.records is defined) else [] }}"

- name: Debug deletion decision factors
  when: ansible_verbosity | int >= 1
  vars:
    _op_instance_delete: "{{ (is_instance and (dns_operation.serverInstanceDNSRecordSet.operation | default('') | lower) == 'delete') }}"
    _op_group_delete: "{{ (is_instance_group and (dns_operation.serverInstanceGroupDNSRecordSet.operation | default('') | lower) == 'delete') }}"
    _op_cluster_delete: "{{ (is_cluster and (dns_operation.clusterDNSRecordSet.operation | default('') | lower) == 'delete') }}"
    _op_server_delete: "{{ (is_server and (dns_operation.serverDNSRecordSet.operation | default('') | lower) == 'delete') }}"
    _op_switch_delete: "{{ (is_switch and (dns_operation.switchDNSRecordSet.operation | default('') | lower) == 'delete') }}"
  ansible.builtin.debug:
    msg:
      records_statuses: "{{ working_operation.records | map(attribute='status') | list }}"
      record_names: "{{ working_operation.records | map(attribute='name') | list }}"
      has_records_to_set: "{{ has_records_to_set }}"
      has_records_to_delete: "{{ has_records_to_delete }}"
      ms_force_delete: "{{ ms_force_delete }}"
      force_delete_names: "{{ force_delete_names }}"
      op_delete_flags:
        instance: "{{ _op_instance_delete }}"
        instance_group: "{{ _op_group_delete }}"
        cluster: "{{ _op_cluster_delete }}"
        server: "{{ _op_server_delete }}"
        switch: "{{ _op_switch_delete }}"

- name: Force convert to deleting if delete operation indicated but no deleting flags set
  vars:
    _op_delete: >-
      {{ (is_instance and (dns_operation.serverInstanceDNSRecordSet.operation | default('') | lower) == 'delete')
         or (is_instance_group and (dns_operation.serverInstanceGroupDNSRecordSet.operation | default('') | lower) == 'delete')
         or (is_cluster and (dns_operation.clusterDNSRecordSet.operation | default('') | lower) == 'delete')
         or (is_server and (dns_operation.serverDNSRecordSet.operation | default('') | lower) == 'delete')
         or (is_switch and (dns_operation.switchDNSRecordSet.operation | default('') | lower) == 'delete') }}
    _force_match_names: >-
      {{ working_operation.records | selectattr('name','defined') | selectattr('name','in', (force_delete_names | map('regex_replace','\.$','') | list)) | list }}
  when: not has_records_to_delete and (
    _op_delete or ms_force_delete | bool or delete_active | bool or (force_delete_names | length > 0 and (_force_match_names | length) > 0)
        )
  ansible.builtin.set_fact:
    working_operation: >-
      {{ working_operation | combine({'records': (working_operation.records | map('combine', {'status': 'deleting'}) | list)}, recursive=True) }}

- name: Debug coercion trigger
  when: ansible_verbosity | int >= 1 and (not has_records_to_delete) and (
          (working_operation.records | selectattr('status','equalto','deleting') | list | length) > 0)
  ansible.builtin.debug:
    msg: >-
      Coerced records to deleting due to {{
        'operation=delete' if _op_delete else (
          'ms_force_delete=true' if (ms_force_delete | bool) else (
            'delete_active=true' if (delete_active | bool) else 'force_delete_names match'
          )
        )
      }}.

- name: Re-evaluate deletion flag after coercion
  when: not has_records_to_delete and (working_operation.records | selectattr('status','equalto','deleting') | list | length) > 0
  ansible.builtin.set_fact:
    has_records_to_delete: true

- name: Debug record processing flags
  when: ansible_verbosity | int >= 1
  ansible.builtin.debug:
    msg:
      has_records_to_set: "{{ has_records_to_set }}"
      has_records_to_delete: "{{ has_records_to_delete }}"
      deleting_records: "{{ working_operation.records | selectattr('status','equalto','deleting') | list | map(attribute='name') | list }}"

- name: Skip if there are no records to process
  ansible.builtin.meta: end_play
  when:
  - not has_records_to_set
  - not has_records_to_delete

# Using working_operation for all subsequent tasks
- name: Parse zone name
  ansible.builtin.set_fact:
    zone_name: "{{ working_operation.zone }}{{ '.' if not working_operation.zone.endswith('.') else '' }}"

- name: Display operation details
  ansible.builtin.debug:
    msg:
    - "Format: {{ 'Switch' if is_switch else 'Server' if is_server else 'Instance Group' if is_instance_group else 'Instance' if is_instance else 'Cluster' if is_cluster else 'Legacy' }}"
    - "Zone: {{ zone_name }}"
    - "Records: {{ working_operation.records | default([]) }}"

# Infoblox modules are idempotent; explicit pre-check of zone existence not required.
# We'll set a default assumption; actual creation handled in create_zone.yml when needed.
- name: Initialize zone existence flags
  ansible.builtin.set_fact:
    zone_exists: false
    zone_created: false
    zone_id: "{{ zone_name }}"

- name: Validate IPv4 auto allocation config
  ansible.builtin.fail:
    msg: "allocate_ipv4 is true but allocation_ipv4_network is empty. Set allocation_ipv4_network (e.g. 192.168.64.0/24)."
  when:
    - allocate_ipv4 | bool
    - (allocation_ipv4_network | default('') | length) == 0

# CREATE/EDIT Operations
- name: Handle CREATE/EDIT operations
  when: has_records_to_set
  block:
  - name: Create zone if needed (Infoblox)
    ansible.builtin.include_tasks: create_zone.yml
    when: not zone_exists or not zone_created

  - name: Add/Update records in zone
    ansible.builtin.include_tasks: create_records.yml
    when:
    - working_operation.records | selectattr('status', 'equalto', 'active') | selectattr('type', 'ne', 'PTR') | list | length > 0

  - name: Handle auto-generated PTR records
    ansible.builtin.include_tasks: create_autogenerated_ptr.yml
    when: working_operation.records | selectattr('status', 'equalto', 'active') | selectattr('type', 'equalto', 'A') | selectattr('ptr', 'defined') | selectattr('ptr', 'equalto', 'enabled') | list | length > 0
    loop: "{{ working_operation.records | selectattr('status', 'equalto', 'active') | selectattr('type', 'equalto', 'A') | selectattr('ptr', 'defined') | list }}"
    loop_control:
      loop_var: a_record

  - name: Handle PTR records
    ansible.builtin.include_tasks: create_ptr.yml
    vars:
      ip_address: "{{ item.name | regex_replace('\\.in-addr\\.arpa\\.$', '') | split('.') | reverse() | join('.') }}"
      ptr_record_value: "{{ item.records[0] }}"
    when: working_operation.records | selectattr('status', 'equalto', 'active') | selectattr('type', 'equalto', 'PTR') | list | length > 0
    loop: "{{ working_operation.records | selectattr('status', 'equalto', 'active') | selectattr('type', 'equalto', 'PTR') | list }}"

# DELETE Operations
- name: Handle DELETE operations
  when: has_records_to_delete
  block:
  - name: Remove records from zone
    ansible.builtin.include_tasks: destroy_records.yml
    when:
    - working_operation.records is defined
    - working_operation.records | selectattr('status', 'equalto', 'deleting') | selectattr('type', 'ne', 'PTR') | list | length > 0

  # Clean up auto-generated PTR records
  - name: Cleanup auto-generated PTR records
    ansible.builtin.include_tasks: destroy_autogenerated_ptr.yml
    when: working_operation.records | selectattr('status', 'equalto', 'deleting') | selectattr('ptr', 'defined') | selectattr('ptr', 'equalto', 'enabled') | list | length > 0
    loop: "{{ working_operation.records | selectattr('status', 'equalto', 'deleting') | selectattr('ptr', 'defined') | selectattr('ptr', 'equalto', 'enabled') | list }}"
    loop_control:
      loop_var: a_record

  # Clean up PTR records
  - name: Cleanup PTR records
    ansible.builtin.include_tasks: delete_ptr_for_ip.yml
    vars:
      ip_address: "{{ item.name | regex_replace('\\.in-addr\\.arpa\\.?$', '') | split('.') | reverse() | join('.') }}"
      ptr_record_value: "{{ (item.records[0] | default('')) if (item.records is defined and (item.records | length) > 0) else '' }}"
    when: working_operation.records | selectattr('status', 'equalto', 'deleting') | selectattr('type', 'equalto', 'PTR') | selectattr('name', 'search', 'in-addr\\.arpa') | list | length > 0
    loop: "{{ working_operation.records | selectattr('status', 'equalto', 'deleting') | selectattr('type', 'equalto', 'PTR') | selectattr('name', 'search', 'in-addr\\.arpa') | list }}"

  - name: Delete zone completely
    ansible.builtin.include_tasks: delete_zone.yml
    when:
    - working_operation.operation is defined
    - working_operation.operation == "dns_zone_deprovisioning"
