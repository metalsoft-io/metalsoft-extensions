---
# Ensure required forward zones exist for host_records before creation (for older WAPI / compat mode cases)

- name: Derive required zone list
  set_fact:
    _required_zones: >-
      {{ host_records
           | map(attribute='zone_name')
           | map('default','')
           | map('regex_replace','\.$','')
           | reject('equalto','')
           | list
           | unique }}

- name: Extract zones from hostnames when zone_name missing
  set_fact:
    _required_zones: >-
      {{ (_required_zones + (
            host_records
              | map(attribute='host_name')
              | map('default','')
              | map('regex_replace','^[^.]+\.','')
              | map('regex_replace','\.$','')
              | reject('equalto','')
              | list
          )) | unique }}
  when: (_required_zones | length) == 0

- name: Filter zones to those not existing yet (noop if module fails)
  set_fact:
    _zones_to_create: "{{ _required_zones }}"

- name: Create forward zones if missing
  nios_zone:
    name: "{{ item }}"
    state: present
    view: "{{ infoblox_dns_view }}"
    provider:
      host: "{{ infoblox_hostname }}"
      username: "{{ infoblox_username }}"
      password: "{{ infoblox_password }}"
      validate_certs: "{{ infoblox_validate_certs }}"
      wapi_version: "{{ infoblox_wapi_version }}"
  loop: "{{ _zones_to_create }}"
  loop_control:
    label: "{{ item }}"
  register: _zone_create_results
  ignore_errors: true

- name: Debug zone creation results
  debug:
    var: _zone_create_results
  when: _zone_create_results is defined