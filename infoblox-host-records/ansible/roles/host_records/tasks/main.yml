---
# Main task file for host_records role
# High-level flow:
# 1. Load provided variables file (variables.json) if given externally (user supplies via -e @file).
# 2. Normalize input into host_records list: [{ name, ipv4, ipv6, state }]
# 3. Create or delete Infoblox host records using nios_host_record
# 4. Optionally create PTR records for IPv4 (and IPv6 if enabled) when creating records.
# Note: Zone management has been removed - zones must exist before creating host records.

- name: Assert required Infoblox connection variables
  assert:
    that:
      - infoblox_hostname | length > 0
      - infoblox_username | length > 0
      - infoblox_password | length > 0
    fail_msg: "infoblox_hostname/username/password must be provided (set with -e or inventory vars)."

- name: Include normalization tasks
  include_tasks: normalize.yml

# Use only native host record module - compat and fallback modes removed

- name: Create / delete host records
  include_tasks: manage_host_records.yml
  when: host_records | length > 0

- name: Summary
  debug:
    msg: "Processed {{ host_records | length }} host record item(s)."
