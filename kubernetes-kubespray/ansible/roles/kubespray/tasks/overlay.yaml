---
# Render the overlay inventory for one nested kubespray run (localhost; fresh per run).
#
# Caller sets:
#   k8s_run_cp      ordered control-plane hosts (== etcd order; CP[0] = bootstrap/first survivor)
#   k8s_run_workers worker hosts for kube_node
#   k8s_run_hostvars optional {host: {var: value}} merged into host_vars (removal-only vars etc.)
#
# The platform inventory (ansible_host/user/password) is passed as an earlier -i source, so
# credentials are never copied: the sudo.ws become password is a LAZY reference.
- name: Overlay | directories
  ansible.builtin.file:
    path: "{{ k8s_ks_dir }}/inventory/{{ item }}"
    state: directory
    mode: "0700"
  loop: [group_vars/all, host_vars]

- name: Overlay | clear previous host_vars
  ansible.builtin.shell: rm -f {{ k8s_ks_dir | quote }}/inventory/host_vars/*.yml
  changed_when: false

- name: Overlay | groups (kube_control_plane and etcd in the same, explicit order)
  ansible.builtin.copy:
    dest: "{{ k8s_ks_dir }}/inventory/hosts.yaml"
    mode: "0600"
    content: |
      # Generated by kubernetes-kubespray {{ k8s_ext_version }}. Group ORDER is significant:
      # kube_control_plane[0] = etcd[0] = {{ k8s_run_cp[0] | default('-') }}
      all:
        children:
          kube_control_plane:
            hosts:
      {% for h in k8s_run_cp %}
              {{ h }}: {}
      {% endfor %}
          etcd:
            hosts:
      {% for h in k8s_run_cp %}
              {{ h }}: {}
      {% endfor %}
          kube_node:
            hosts:{{ ' {}' if (k8s_run_workers | length == 0) else '' }}
      {% for h in k8s_run_workers %}
              {{ h }}: {}
      {% endfor %}
          calico_rr:
            hosts: {}
          k8s_cluster:
            children:
              kube_control_plane: {}
              kube_node: {}
              calico_rr: {}

- name: Overlay | host vars
  ansible.builtin.copy:
    dest: "{{ k8s_ks_dir }}/inventory/host_vars/{{ item }}.yml"
    mode: "0600"
    content: |
      {% set hv = hostvars[item] %}
      {% set role = 'control-plane' if item in k8s_run_cp else 'worker' %}
      {% set base = {
           'ip': hv.ansible_host | default(item),
           'access_ip': hv.ansible_host | default(item),
           'kube_override_hostname': item,
           'node_labels': {'metalsoft.io/cluster-id': k8s_cluster_id, 'metalsoft.io/role': role}} %}
      {% if item in k8s_run_cp %}
      {%   set _ = base.update({'etcd_member_name': k8s_etcd_member_names[item]}) %}
      {%   if hv.k8s_default_if | default('') %}
      {%     set _ = base.update({'kube_vip_interface': hv.k8s_default_if}) %}
      {%   endif %}
      {% endif %}
      {% set _ = base.update((k8s_run_hostvars | default({})).get(item, {})) %}
      {{ base | to_nice_yaml(indent=2) }}
      {% if (hv._sl_sudo_probe.stdout | default('') | trim) == 'SUDOWS' %}
      ansible_become_exe: /usr/bin/sudo.ws
      ansible_become_password: "{% raw %}{{ ansible_password }}{% endraw %}"
      {% endif %}
  loop: "{{ k8s_run_cp + k8s_run_workers }}"

- name: Overlay | group vars
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ k8s_ks_dir }}/inventory/group_vars/all/{{ item.dest }}"
    mode: "0600"
  loop:
    - {src: 00-base.yml.j2, dest: 00-base.yml}
    - {src: zz-owned.yml.j2, dest: zz-owned.yml}

- name: Overlay | site overrides (recorded copy; denylisted keys already rejected)
  ansible.builtin.copy:
    dest: "{{ k8s_ks_dir }}/inventory/group_vars/all/90-site-overrides.yml"
    mode: "0600"
    content: "{{ k8s_effective_site.overrides | default({}, true) | to_nice_yaml(indent=2) if (k8s_effective_site.overrides | default({}, true)) else '{}\n' }}"

- name: Overlay | platform inventory sources
  ansible.builtin.copy:
    dest: "{{ k8s_ks_dir }}/sources"
    mode: "0600"
    content: "{{ ansible_inventory_sources | default([]) | join('\n') }}\n"
