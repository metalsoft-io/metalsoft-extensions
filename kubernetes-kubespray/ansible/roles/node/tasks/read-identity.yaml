---
# Per-node identity and the CP copies of the cluster state (become; read-only).
# Results stay as host facts (k8s_node_*) for the localhost merge/plan play.
- name: Identity | node files
  ansible.builtin.shell: |
    set -u
    cid=$(cat {{ k8s_state_dir }}/cluster-id 2>/dev/null || true)
    ca=$(sha256sum /etc/kubernetes/ssl/ca.crt 2>/dev/null | awk '{print $1}')
    eca=$(sha256sum /etc/ssl/etcd/ssl/ca.pem 2>/dev/null | awk '{print $1}')
    f() { [ -e "$1" ] && echo true || echo false; }
    dev=$(ip -o -4 route show default | awk '{print $5; exit}')
    printf '{"cluster_id":"%s","ca_sha":"%s","etcd_ca_sha":"%s","kubelet_config":%s,"kubelet_conf":%s,"admin_conf":%s,"etcd_data":%s,"removed":%s,"default_if":"%s"}\n' \
      "$cid" "$ca" "$eca" "$(f /var/lib/kubelet/config.yaml)" "$(f /etc/kubernetes/kubelet.conf)" \
      "$(f /etc/kubernetes/admin.conf)" "$(f /var/lib/etcd/member)" "$(f {{ k8s_state_dir }}/removed)" "$dev"
  args:
    executable: /bin/bash
  register: _k8s_ident
  changed_when: false

- name: Identity | state copy (control-plane nodes)
  ansible.builtin.slurp:
    src: "{{ k8s_state_file }}"
  register: _k8s_state_copy
  failed_when: false
  when: inventory_hostname in (k8s_cp_hosts + k8s_cp_scale_in)

- name: Identity | facts
  ansible.builtin.set_fact:
    k8s_node_ident: "{{ _k8s_ident.stdout | from_json }}"
    k8s_default_if: "{{ (_k8s_ident.stdout | from_json).default_if }}"
    k8s_node_state: >-
      {{ (_k8s_state_copy.content | b64decode | from_json)
         if (_k8s_state_copy.content is defined) else {} }}
