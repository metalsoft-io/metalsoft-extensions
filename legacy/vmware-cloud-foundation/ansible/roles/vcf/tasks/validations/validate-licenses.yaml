---
# License Configuration Validation Tasks
# Enforces all-or-none license key usage. If all four license keys are present,
# they are automatically used (licenses_required=true). Partial sets are invalid.

- name: Assert | No partial license key set
  tags: ['validation', 'license']
  ansible.builtin.assert:
    that:
      - not (partial_license_keys_set | bool)
    fail_msg: "Partial license key set detected. Provide all (esxi, vsan, nsx, vcenter) or none."
    success_msg: "No partial license key set."

- name: Validate | VCF License Configuration
  tags: ['validation', 'license']
  ansible.builtin.assert:
    that:
      - vcf.license is defined
      - vcf.license.esxi is not none
      - vcf.license.esxi | length > 0
      - vcf.license.vsan is not none
      - vcf.license.vsan | length > 0
      - vcf.license.nsx is not none
      - vcf.license.nsx | length > 0
      - vcf.license.vcenter is not none
      - vcf.license.vcenter | length > 0
    fail_msg: "VCF licenses (esxi, vsan, nsx, vcenter) are required"
    success_msg: "VCF licenses are set"
  when: licenses_required | bool
