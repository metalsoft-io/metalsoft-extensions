[defaults]
interpreter_python = auto_silent
action_warnings = False
deprecation_warnings = False
display_skipped_hosts = False

[ssh_connection]
host_key_checking = False
; The installer environment and the installed AHV answer on the same IP with different host keys:
; never record them, or the second key trips the MITM check and disables password auth.
ssh_args = -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no -o ConnectTimeout=15
