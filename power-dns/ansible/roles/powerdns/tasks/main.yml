# prettier-ignore-file
# yamllint disable
---
# Detect which JSON format
- name: Detect JSON format type
  ansible.builtin.set_fact:
    # Check if it's instance group format
    is_instance_group: >-
      {{
      (
        serverInstanceGroupDNSRecordSet is defined
        and serverInstanceGroupDNSRecordSet.records is defined
        and (serverInstanceGroupDNSRecordSet.records | length > 0)
      )
      }}
    # Check if it's single instance format
    is_instance: >-
      {{
      (
        serverInstanceDNSRecordSet is defined
        and serverInstanceDNSRecordSet.records is defined
        and (serverInstanceDNSRecordSet.records | length > 0)
      )
      }}
    # Check if it's cluster format
    is_cluster: >-
      {{
      (
        clusterDNSRecordSet is defined
        and clusterDNSRecordSet.records is defined
        and (clusterDNSRecordSet.records | length > 0)
      )
      }}
    # Check if it's server format (physical server management)
    is_server: "{{ serverDNSRecordSet is defined }}"
    # Check if it's switch format (network switch management)
    is_switch: "{{ switchDNSRecordSet is defined }}"

# Detect management address type for servers
- name: Analyze management address type for servers
  when: is_server
  ansible.builtin.set_fact:
    mgmt_is_ipv4: "{{ serverDNSRecordSet.managementAddress | regex_search('^[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}$') }}"
    mgmt_is_ipv6: "{{ ':' in serverDNSRecordSet.managementAddress }}"
    mgmt_is_hostname: "{{ not (serverDNSRecordSet.managementAddress | regex_search('^[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}$')) and ':' not in serverDNSRecordSet.managementAddress }}"

# Detect management address type for switches
- name: Analyze management address type for switches
  when: is_switch
  ansible.builtin.set_fact:
    mgmt_is_ipv4: "{{ switchDNSRecordSet.managementAddress | regex_search('^[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}$') }}"
    mgmt_is_ipv6: "{{ ':' in switchDNSRecordSet.managementAddress }}"
    mgmt_is_hostname: "{{ not (switchDNSRecordSet.managementAddress | regex_search('^[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}$')) and ':' not in switchDNSRecordSet.managementAddress }}"

# Transform instance group format
- name: Transform instance group format
  when: is_instance_group
  ansible.builtin.set_fact:
    transformed_operation:
      zone: "{{ serverInstanceGroupDNSRecordSet.zone.zoneName }}"
      nameservers: "{{ serverInstanceGroupDNSRecordSet.zone.nameServers }}"
      records: "{{ serverInstanceGroupDNSRecordSet.records }}"
      soa_email: "{{ serverInstanceGroupDNSRecordSet.zone.soaEmail }}"

# Transform instance format
- name: Transform instance format
  when: is_instance
  ansible.builtin.set_fact:
    transformed_operation:
      zone: "{{ serverInstanceDNSRecordSet.zone.zoneName }}"
      nameservers: "{{ serverInstanceDNSRecordSet.zone.nameServers }}"
      records: "{{ serverInstanceDNSRecordSet.records }}"
      soa_email: "{{ serverInstanceDNSRecordSet.zone.soaEmail }}"

# Transform instance format
- name: Transform cluster format
  when: is_cluster
  ansible.builtin.set_fact:
    transformed_operation:
      zone: "{{ clusterDNSRecordSet.zone.zoneName }}"
      nameservers: "{{ clusterDNSRecordSet.zone.nameServers }}"
      records: "{{ clusterDNSRecordSet.records }}"
      soa_email: "{{ clusterDNSRecordSet.zone.soaEmail }}"

# Transform server format (physical servers)
- name: Transform server format
  when: is_server
  ansible.builtin.set_fact:
    transformed_operation:
      zone: "{{ serverDNSRecordSet.zone.zoneName }}"
      nameservers: "{{ serverDNSRecordSet.zone.nameServers }}"
      records: >-
        {%- if serverDNSRecordSet.operation == 'delete' -%}
          {{ [
            {'name': serverDNSRecordSet.hostname, 'status': 'deleting', 'type': 'A', 'ptr': 'enabled', 'records': [serverDNSRecordSet.ip.ip] if serverDNSRecordSet.ip.ip is defined else []},
            {'name': serverDNSRecordSet.hostname, 'status': 'deleting', 'type': 'AAAA'},
            {'name': serverDNSRecordSet.hostname, 'status': 'deleting', 'type': 'CNAME'}
          ] }}
        {%- else -%}
          {%- if mgmt_is_ipv6 -%}
            {{ [{'name': serverDNSRecordSet.hostname, 'status': 'active', 'type': 'AAAA', 'records': [serverDNSRecordSet.managementAddress] if serverDNSRecordSet.ip.status == 'allocated' else [], 'ttl': serverDNSRecordSet.zone.ttl | default(3600)}] }}
          {%- elif mgmt_is_ipv4 -%}
            {{ [{'name': serverDNSRecordSet.hostname, 'status': 'active', 'type': 'A', 'ptr': 'enabled', 'records': [serverDNSRecordSet.managementAddress] if serverDNSRecordSet.ip.status == 'allocated' else [], 'ttl': serverDNSRecordSet.zone.ttl | default(3600)}] }}
          {%- else -%}
            {{ [{'name': serverDNSRecordSet.hostname, 'status': 'active', 'type': 'CNAME', 'records': [serverDNSRecordSet.managementAddress], 'ttl': serverDNSRecordSet.zone.ttl | default(3600)}] }}
          {%- endif -%}
        {%- endif -%}
      infrastructure_id: "{{ serverDNSRecordSet.serverId }}"
      soa_email: "{{ serverDNSRecordSet.zone.soaEmail }}"

# Transform switch format (network switches)
- name: Transform switch format
  when: is_switch
  ansible.builtin.set_fact:
    transformed_operation:
      zone: "{{ switchDNSRecordSet.zone.zoneName }}"
      nameservers: "{{ switchDNSRecordSet.zone.nameServers }}"
      records: >-
        {%- if switchDNSRecordSet.operation == 'delete' -%}
          {{ [
            {'name': switchDNSRecordSet.hostname, 'status': 'deleting', 'type': 'A', 'ptr': 'enabled', 'records': [switchDNSRecordSet.ip.ip] if switchDNSRecordSet.ip.ip is defined else []},
            {'name': switchDNSRecordSet.hostname, 'status': 'deleting', 'type': 'AAAA'},
            {'name': switchDNSRecordSet.hostname, 'status': 'deleting', 'type': 'CNAME'}
          ] }}
        {%- else -%}
          {%- if mgmt_is_ipv6 -%}
            {{ [{'name': switchDNSRecordSet.hostname, 'status': 'active', 'type': 'AAAA', 'records': [switchDNSRecordSet.managementAddress] if switchDNSRecordSet.ip.status == 'allocated' else [], 'ttl': switchDNSRecordSet.zone.ttl | default(3600)}] }}
          {%- elif mgmt_is_ipv4 -%}
            {{ [{'name': switchDNSRecordSet.hostname, 'status': 'active', 'type': 'A', 'ptr': 'enabled', 'records': [switchDNSRecordSet.managementAddress] if switchDNSRecordSet.ip.status == 'allocated' else [], 'ttl': switchDNSRecordSet.zone.ttl | default(3600)}] }}
          {%- else -%}
            {{ [{'name': switchDNSRecordSet.hostname, 'status': 'active', 'type': 'CNAME', 'records': [switchDNSRecordSet.managementAddress], 'ttl': switchDNSRecordSet.zone.ttl | default(3600)}] }}
          {%- endif -%}
        {%- endif -%}
      infrastructure_id: "{{ switchDNSRecordSet.switchId }}"
      soa_email: "{{ switchDNSRecordSet.zone.soaEmail }}"

# Updated to include is_server and is_switch
- name: Set working operation
  ansible.builtin.set_fact:
    working_operation: "{{ transformed_operation if (is_instance_group or is_instance or is_cluster or is_server or is_switch) else {} }}"

# Helper to check if record has content
- name: Check if there are records to process
  ansible.builtin.set_fact:
    has_records_to_set: >-
      {{
      (
        working_operation.records is defined
        and (working_operation.records | length > 0)
        and (working_operation.records | selectattr('status', 'equalto', 'active') | list | length > 0)
      )
      }}
    has_records_to_delete: >-
      {{
      (
        working_operation.records is defined
        and (working_operation.records | length > 0)
        and (working_operation.records | selectattr('status', 'equalto', 'deleting') | list | length > 0)
      )
      }}

- name: Skip if there are no records to process
  ansible.builtin.meta: end_play
  when:
  - not has_records_to_set
  - not has_records_to_delete

# Using working_operation for all subsequent tasks
- name: Parse zone name
  ansible.builtin.set_fact:
    zone_name: "{{ working_operation.zone }}{{ '.' if not working_operation.zone.endswith('.') else '' }}"

- name: Display operation details
  ansible.builtin.debug:
    msg:
    - "Format: {{ 'Switch' if is_switch else 'Server' if is_server else 'Instance Group' if is_instance_group else 'Instance' if is_instance else 'Cluster' if is_cluster else 'Legacy' }}"
    - "Zone: {{ zone_name }}"
    - "Records: {{ working_operation.records | default([]) }}"

- name: Validate PowerDNS API connectivity
  ansible.builtin.uri:
    url: "{{ powerdns_base_url }}"
    headers:
      X-API-Key: "{{ powerdns_api_key }}"
    status_code: 200

- name: Get existing zones
  ansible.builtin.uri:
    url: "{{ powerdns_base_url }}/zones"
    method: GET
    headers:
      X-API-Key: "{{ powerdns_api_key }}"
  register: zones_list

- name: Check if zone exists
  ansible.builtin.set_fact:
    zone_exists: "{{ (zones_list.json | selectattr('name', 'equalto', zone_name) | list | length > 0) if (zones_list is defined and 'json' in zones_list) else false }}"
    zone_data: "{{ (zones_list.json | selectattr('name', 'equalto', zone_name) | list | first) if (zones_list is defined and 'json' in zones_list and zones_list.json | selectattr('name', 'equalto', zone_name) | list | length > 0) else {} }}"

- name: Set zone_id
  ansible.builtin.set_fact:
    zone_id: "{{ zone_data.id | default(zone_name) }}"

# CREATE/EDIT Operations
- name: Handle CREATE/EDIT operations
  when: has_records_to_set
  block:
  - name: Create zone if needed
    ansible.builtin.include_tasks: create_zone.yml
    when: not zone_exists

  - name: Add/Update records in zone
    ansible.builtin.include_tasks: create_records.yml
    when:
    - zone_exists or zone_created | default(false)
    - working_operation.records | selectattr('status', 'equalto', 'active') | selectattr('type', 'ne', 'PTR') | list | length > 0

  - name: Handle auto-generated PTR records
    ansible.builtin.include_tasks: create_autogenerated_ptr.yml
    when: working_operation.records | selectattr('status', 'equalto', 'active') | selectattr('type', 'equalto', 'A') | selectattr('ptr', 'defined') | selectattr('ptr', 'equalto', 'enabled') | list | length > 0
    loop: "{{ working_operation.records | selectattr('status', 'equalto', 'active') | selectattr('type', 'equalto', 'A') | selectattr('ptr', 'defined') | list }}"
    loop_control:
      loop_var: a_record

  - name: Handle PTR records
    ansible.builtin.include_tasks: create_ptr.yml
    vars:
      ip_address: "{{ item.name | regex_replace('\\.in-addr\\.arpa\\.$', '') | split('.') | reverse() | join('.') }}"
      ptr_record_value: "{{ item.records[0] }}"
    when: working_operation.records | selectattr('status', 'equalto', 'active') | selectattr('type', 'equalto', 'PTR') | list | length > 0
    loop: "{{ working_operation.records | selectattr('status', 'equalto', 'active') | selectattr('type', 'equalto', 'PTR') | list }}"

# DELETE Operations
- name: Handle DELETE operations
  when: has_records_to_delete
  block:
  - name: Remove records from zone
    ansible.builtin.include_tasks: destroy_records.yml
    when:
    - zone_exists
    - working_operation.records is defined
    - working_operation.records | selectattr('status', 'equalto', 'deleting') | selectattr('type', 'ne', 'PTR') | list | length > 0

  # Clean up auto-generated PTR records
  - name: Cleanup auto-generated PTR records
    ansible.builtin.include_tasks: destroy_autogenerated_ptr.yml
    when: working_operation.records | selectattr('status', 'equalto', 'deleting') | selectattr('ptr', 'defined') | selectattr('ptr', 'equalto', 'enabled') | list | length > 0
    loop: "{{ working_operation.records | selectattr('status', 'equalto', 'deleting') | selectattr('ptr', 'defined') | selectattr('ptr', 'equalto', 'enabled') | list }}"
    loop_control:
      loop_var: a_record

  # Clean up PTR records
  - name: Cleanup PTR records
    ansible.builtin.include_tasks: delete_ptr_for_ip.yml
    vars:
      ip_address: "{{ item.name | regex_replace('\\.in-addr\\.arpa\\.?$', '') | split('.') | reverse() | join('.') }}"
    when: working_operation.records | selectattr('status', 'equalto', 'deleting') | selectattr('type', 'equalto', 'PTR') | selectattr('name', 'search', 'in-addr\\.arpa') | list | length > 0
    loop: "{{ working_operation.records | selectattr('status', 'equalto', 'deleting') | selectattr('type', 'equalto', 'PTR') | selectattr('name', 'search', 'in-addr\\.arpa') | list }}"

  - name: Delete zone completely
    ansible.builtin.include_tasks: delete_zone.yml
    when:
    - zone_exists
    - working_operation.operation is defined
    - working_operation.operation == "dns_zone_deprovisioning"
