---
deployment_id: "{{ extensionInstanceRecordSet.deploymentId }}"
instance_id: "{{ ocp_instance_id | default('0') }}"
image_name: "{{ _cluster_name | default('ocp-agent') }}"
deployment_uuid: "ocp-{{ extensionInstanceRecordSet.deploymentId }}-{{ ocp_instance_id | default('0') }}"

runner_base_data_dir: "/runner"
runner_tmp_dir: "{{ lookup('env', 'ANSIBLE_LOCAL_TEMP') }}"
iso_filename: "ISO_{{ deployment_id }}_{{ instance_id }}_{{ image_name }}.iso"
ocp_install_dir: "{{ runner_base_data_dir }}/iso/{{ deployment_uuid }}"
iso_final_path: "{{ runner_base_data_dir }}/iso/{{ deployment_uuid }}/ISO_{{ deployment_id }}_{{ instance_id }}_{{ image_name }}.iso"
context_json_file_path: "{{ runner_base_data_dir }}/artifacts/{{ lookup('env', 'ANSIBLE_RUNNER_IDENT') }}/context.json"

_cluster_name: "{{ extensionInstanceRecordSet.extensionInstanceName }}"
# The platform provisions DNS records (api/*.apps) under the site's default zone,
# which arrives as recordSet.baseDomain — it must be authoritative or the cluster
# FQDNs won't match the records that actually exist.
_base_domain: "{{ extensionInstanceRecordSet.baseDomain | default(extensionInstanceVariables.base_domain | default('metalcloud.local'), true) }}"
_cluster_network: "{{ extensionInstanceVariables.cluster_network }}"
_service_network: "{{ extensionInstanceVariables.service_network }}"
_compute_nodes: "{{ extensionInstanceVariables.compute_nodes | int }}"
_control_plane_nodes: "{{ extensionInstanceVariables.control_plane_nodes | int }}"
# pull_secret is a site config var. The platform base64-decodes + JSON-parses ONLY
# extensionInstanceVariables.pull_secret — a configVars value arrives VERBATIM, so
# normalize here: accept a dict (legacy decoded input on old instances), a raw JSON
# string, or a base64-encoded JSON string, and always yield {"auths": {...}}.
_pull_secret_raw: >-
  {{ configVars.pull_secret
     | default(extensionInstanceVariables.pull_secret | default('', true), true) }}
_pull_secret: >-
  {{ _pull_secret_raw if _pull_secret_raw is mapping
     else ((_pull_secret_raw | trim | from_json)
           if (_pull_secret_raw | trim).startswith('{')
           else (_pull_secret_raw | b64decode | from_json)) }}
# Legacy fallbacks: old instances on the shared bundle URL still send these as
# inputs (and the oldest send airgapped_deployment) — configVars win when present.
_use_private_registry: "{{ configVars.use_private_registry | default(extensionInstanceVariables.use_private_registry | default(extensionInstanceVariables.airgapped_deployment | default(false))) | bool }}"
_mirror_registry: "{{ configVars.mirror_registry | default(extensionInstanceVariables.mirror_registry | default('registry.metalsoft.dev/ocp4/openshift4')) }}"
_mtu: "{{ configVars.mtu | default(extensionInstanceVariables.mtu | default(1500)) | int }}"
# Site DNS resolvers from the extension config var (arrives top-level or under
# configVars, possibly as a comma-separated string); recordSet values are fallback only.
_dns_resolvers_config: "{{ configVars.DNSResolvers | default(DNSResolvers | default('')) }}"
_dns_resolvers: >-
  {{ (_dns_resolvers_config | string).split(',') | map('trim') | reject('equalto', '') | list
     or extensionInstanceRecordSet.dnsResolvers | default([], true)
     or [extensionInstanceRecordSet.dnsResolverIp] }}
_ocp_version: "{{ configVars.ocp_version | default(extensionInstanceVariables.ocp_version) }}"

# Split mirror_registry into host and namespace path components
# e.g. "registry.metalsoft.dev/ocp4/openshift4" → host="registry.metalsoft.dev", path="ocp4/openshift4"
# Derived from _mirror_registry so the default fallback is always safe when the private registry is not used.
_mirror_registry_host: "{{ _mirror_registry.split('/')[0] }}"
_mirror_registry_path: "{{ _mirror_registry.split('/')[1:] | join('/') }}"

_openshift_install_bin: /usr/local/bin/openshift-install

# The installer validates the ClusterImageSet in the state file against the release
# image it expects at EVERY invocation — the override must be identical for create
# image / create cluster-manifests / wait-for, or asset loading fails.
_release_image_override_env: >-
  {{ {'OPENSHIFT_INSTALL_RELEASE_IMAGE_OVERRIDE': _mirror_registry ~ ':' ~ _ocp_version}
     if _use_private_registry | bool else {} }}

_monitor_installation: false
_retry_install_complete_check: false

# Single-node: platform "none" means keepalived never binds the allocated VIPs, yet the
# platform points api/*.apps DNS at them — the node must own those IPs itself (template
# adds them as secondary addresses on the node NIC).
_is_sno: "{{ (_control_plane_nodes | int == 1) and (_compute_nodes | int == 0) }}"
_api_vip_ip: >-
  {{ extensionInstanceRecordSet.clusterIpv4Ips | default([])
     | selectattr('tags.role', 'defined') | selectattr('tags.role', 'equalto', 'api-vip')
     | map(attribute='ip') | first | default('') }}
_ingress_vip_ip: >-
  {{ extensionInstanceRecordSet.clusterIpv4Ips | default([])
     | selectattr('tags.role', 'defined') | selectattr('tags.role', 'equalto', 'ingress-vip')
     | map(attribute='ip') | first | default('') }}

_api_url: "https://api.{{ _cluster_name }}.{{ _base_domain }}:6443"
_console_url: "https://console-openshift-console.apps.{{ _cluster_name }}.{{ _base_domain }}"

# Cluster auth generated at deploy time and returned via context.json keys matching the
# declared OUTPUT labels (persisted in customJson.outputs). The `context` extra-var only
# survives within one deployment's job chain, so later (onEdit) runs need the platform to
# re-inject outputs — accept every plausible source, newest first.
_cluster_kubeconfig_content: >-
  {{ extensionInstanceVariables.cluster_kubeconfig
     | default(extensionInstanceOutputs.cluster_kubeconfig
     | default(context['cluster_kubeconfig']
     | default(context['auth-kubeconfig']
     | default('', true), true), true), true) }}
_cluster_kubeadmin_password_content: >-
  {{ extensionInstanceVariables.cluster_kubeadmin_password
     | default(extensionInstanceOutputs.cluster_kubeadmin_password
     | default(context['cluster_kubeadmin_password']
     | default(context['auth-kubeadmin-password']
     | default('', true), true), true), true) }}

# Every context.json write REPLACES customJson.outputs — always re-emit all declared
# outputs (plus the auth-* keys consumed by same-chain follow-up tasks).
_context_outputs_payload:
  cluster_kubeconfig: "{{ _cluster_kubeconfig_content }}"
  cluster_kubeadmin_password: "{{ _cluster_kubeadmin_password_content }}"
  api_url: "{{ _api_url }}"
  console_url: "{{ _console_url }}"
  auth-kubeconfig: "{{ _cluster_kubeconfig_content }}"
  auth-kubeadmin-password: "{{ _cluster_kubeadmin_password_content }}"

# Scaling (onEdit) — inventory scale groups are named <instanceArray label>_scale_out/_scale_in
_scale_out_hosts: "{{ groups['compute_scale_out'] | default([]) }}"
_scale_in_hosts: "{{ groups['compute_scale_in'] | default([]) }}"
_scale_out_instances: >-
  {{ extensionInstanceRecordSet.serverInstances | default([])
     | selectattr('host', 'in', _scale_out_hosts) | list }}
# postDeploy-readiness predicate: at preDeploy the new servers exist in inventory but
# are not provisioned yet — their recordSet entries lack IP/NIC data. Only act when
# every scale-out host has allocation data.
_scale_out_data_ready: >-
  {{ _scale_out_hosts | length > 0
     and (_scale_out_instances | selectattr('ipv4Ips', 'defined')
          | selectattr('ipv4Ips') | list | length) == (_scale_out_hosts | length) }}

_addnodes_dir: "{{ runner_base_data_dir }}/iso/{{ deployment_uuid }}-addnodes"
_addnodes_iso_path: "{{ _addnodes_dir }}/ISO_{{ deployment_id }}_{{ instance_id }}_{{ image_name }}_addnodes.iso"
_scale_kubeconfig: "{{ _addnodes_dir }}/auth/kubeconfig"

_oc_bin: /usr/local/bin/oc
_drain_timeout_seconds: 600
_drain_retries: 3
_drain_delay: 30

_scale_watch_retries: 60
_scale_watch_delay: 60

# On a fresh deployment the API VIP only answers once the bootstrap control plane
# is up — 20-30+ min after the nodes boot the ISO. Budget a full hour.
_api_wait_retries: 60
_api_wait_delay: 60

_bootstrap_wait_retries: 60
_bootstrap_wait_delay: 60

_install_wait_retries: 60
_install_wait_delay: 60
