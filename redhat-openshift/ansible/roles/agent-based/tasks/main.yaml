---
- name: Prepare installation directory
  ansible.builtin.import_tasks:
    file: prepare-install-dir.yaml

- name: Check if ISO already exists
  ansible.builtin.stat:
    path: "{{ iso_final_path }}"
  register: iso_exists

- name: Validate mirror_registry is defined when using a private registry
  ansible.builtin.fail:
    msg: >-
      The mirror_registry site config variable must be defined and non-empty
      when use_private_registry is true
  when:
    - _use_private_registry | bool
    - (_mirror_registry | default('') | trim) == ''

# Public installs pull the release payload from quay.io/openshift-release-dev —
# a pull secret without quay.io auth fails 'unauthorized' only ~13 min into ISO
# creation. Catch it up front.
- name: Validate pull secret covers quay.io on public-registry installs
  ansible.builtin.fail:
    msg: >-
      use_private_registry is false but the pull_secret has no auth entry for
      quay.io — the release payload download will fail with 'unauthorized'.
      Provide the full Red Hat pull secret (console.redhat.com/openshift/downloads)
      or set use_private_registry to true to install from the mirror.
  when:
    - not (_use_private_registry | bool)
    - "'quay.io' not in (_pull_secret.auths | default({}))"

# - name: Generate install-config.yaml in the installation directory
#   template:
#     src: install-config.yaml.j2
#     dest: "{{ ocp_install_dir }}/install-config.yaml"
#     mode: '0644'

# - name: Generate agent-config.yaml in the installation directory
#   template:
#     src: agent-config.yaml.j2
#     dest: "{{ ocp_install_dir }}/agent-config.yaml"
#     mode: '0644'

- name: Write pull secret to installation directory
  ansible.builtin.copy:
    content: "{{ _pull_secret | to_json }}"
    dest: "{{ ocp_install_dir }}/.pull-secret.json"
    mode: '0600'
  when: not iso_exists.stat.exists

- name: Set registry validation commands
  ansible.builtin.set_fact:
    registry_validation_commands: >-
      {{
        [
          'REGISTRY_AUTH=$(jq -r \'.auths["' + _mirror_registry_host + '"].auth // empty\' '
          + ocp_install_dir + '/.pull-secret.json 2>/dev/null || true);'
          + ' HTTP_CODE=$(curl -sSk --max-time 10'
          + ' -H "Authorization: Basic ${REGISTRY_AUTH:-}"'
          + ' -o /dev/null -w "%{http_code}"'
          + ' https://' + _mirror_registry_host + '/v2/);'
          + ' case "$HTTP_CODE" in 200|401) ;; *) echo "Registry unreachable: HTTP ${HTTP_CODE}" >&2; exit 1;; esac',
          'REGISTRY_AUTH=$(jq -r \'.auths["' + _mirror_registry_host + '"].auth // empty\' '
          + ocp_install_dir + '/.pull-secret.json 2>/dev/null || true);'
          + ' HTTP_CODE=$(curl -sSk --max-time 10'
          + ' -H "Authorization: Basic ${REGISTRY_AUTH:-}"'
          + ' -o /dev/null -w "%{http_code}"'
          + ' https://' + _mirror_registry_host + '/v2/' + _mirror_registry_path + '/tags/list);'
          + ' case "$HTTP_CODE" in 200|401) ;; *) echo "Registry unreachable: HTTP ${HTTP_CODE}" >&2; exit 1;; esac'
        ]
        if _use_private_registry
        else [
          'HTTP_CODE=$(curl -sSk --max-time 10 -o /dev/null -w "%{http_code}" https://quay.io/v2/);'
          + ' case "$HTTP_CODE" in 200|401) ;; *) echo "Registry unreachable: HTTP ${HTTP_CODE}" >&2; exit 1;; esac',
          'HTTP_CODE=$(curl -sSk --max-time 10 -o /dev/null -w "%{http_code}" https://registry.redhat.io/v2/);'
          + ' case "$HTTP_CODE" in 200|401) ;; *) echo "Registry unreachable: HTTP ${HTTP_CODE}" >&2; exit 1;; esac'
        ]
      }}
  when: not iso_exists.stat.exists

- name: Validate container registries connectivity
  ansible.builtin.shell: "{{ item }}"
  loop: "{{ registry_validation_commands }}"
  loop_control:
    label: "{{ item }}"
  register: registry_validation_results
  ignore_errors: true
  when: not iso_exists.stat.exists

- name: Log registry validation results
  ansible.builtin.debug:
    msg: >-
      Registry validation '{{ item.item }}'
      rc={{ item.rc }}
      stdout={{ item.stdout }}
      stderr={{ item.stderr }}
  loop: "{{ registry_validation_results.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: not iso_exists.stat.exists

- name: Fail if any registry validation command failed
  ansible.builtin.fail:
    msg: >-
      Registry validation failed for '{{ item.item }}'
      rc={{ item.rc }}
      stdout={{ item.stdout }}
      stderr={{ item.stderr }}
  loop: "{{ registry_validation_results.results }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - not iso_exists.stat.exists
    - item.rc != 0

- name: Get built-in release image from openshift-install binary
  ansible.builtin.shell:
    cmd: "{{ _openshift_install_bin }} version | awk '/release image/{print $3}'"
  register: _ocp_release_image
  when:
    - not iso_exists.stat.exists
    - _use_private_registry | bool

- name: Verify release image digest is present in mirror
  ansible.builtin.shell:
    cmd: |
      DIGEST=$(echo '{{ _ocp_release_image.stdout | trim }}' | sed 's/.*@//')
      AUTH=$(jq -r '.auths["{{ _mirror_registry_host }}"].auth // empty' \
             '{{ ocp_install_dir }}/.pull-secret.json' 2>/dev/null || true)
      HTTP_CODE=$(curl -sSk --max-time 15 \
        -H "Authorization: Basic ${AUTH:-}" \
        -o /dev/null -w "%{http_code}" \
        "https://{{ _mirror_registry_host }}/v2/{{ _mirror_registry_path }}/manifests/${DIGEST}")
      case "$HTTP_CODE" in
        200) ;;
        404) echo "Mirror missing release manifest ${DIGEST}: image not found" >&2; exit 1;;
        401) echo "Mirror auth failed for ${DIGEST}: check pull secret credentials" >&2; exit 1;;
        *) echo "Mirror check failed for ${DIGEST}: HTTP ${HTTP_CODE}" >&2; exit 1;;
      esac
  register: _mirror_release_check
  ignore_errors: true
  when:
    - not iso_exists.stat.exists
    - _use_private_registry | bool
    - (_ocp_release_image.stdout | trim) != ''

- name: Fail if mirror does not have the release image
  ansible.builtin.fail:
    msg: >-
      Mirror {{ _mirror_registry }} does not have the release image
      {{ _ocp_release_image.stdout | trim }}.
      Re-sync the mirror with:
      oc adm release mirror
      --from='{{ _ocp_release_image.stdout | trim }}'
      --to={{ _mirror_registry }} --insecure=true
  when:
    - not iso_exists.stat.exists
    - _use_private_registry | bool
    - _mirror_release_check is defined
    - not (_mirror_release_check.skipped | default(false))
    - _mirror_release_check.rc != 0

# Since OCP 4.22 the default 'openshift' cluster image policy enforces sigstore
# signature verification for the release image repositories: nodes reject any
# release image whose sha256-<digest>.sig manifest is not served by the mirror
# ("A signature was required, but no signature exists"). 'oc adm release mirror'
# does NOT copy those signatures — verify them up front instead of failing on
# the node consoles 90 minutes into the install.
- name: Determine machine-config-operator digest (sigstore preflight)
  ansible.builtin.shell:
    cmd: >-
      oc adm release info --registry-config '{{ ocp_install_dir }}/.pull-secret.json'
      --image-for=machine-config-operator '{{ _mirror_registry }}:{{ _ocp_version }}'
      | sed 's/.*@//'
  register: _sigstore_mco_digest
  when:
    - not iso_exists.stat.exists
    - _use_private_registry | bool
    - _ocp_version is version('4.22', '>=')

- name: Verify sigstore signatures are present in mirror (OCP >= 4.22)
  ansible.builtin.shell:
    cmd: |
      AUTH=$(jq -r '.auths["{{ _mirror_registry_host }}"].auth // empty' \
             '{{ ocp_install_dir }}/.pull-secret.json' 2>/dev/null || true)
      RELEASE_DIGEST=$(echo '{{ _ocp_release_image.stdout | trim }}' | sed 's/.*@//')
      MISSING=""
      for DIGEST in "${RELEASE_DIGEST}" "{{ _sigstore_mco_digest.stdout | trim }}"; do
        SIG_TAG="sha256-${DIGEST#sha256:}.sig"
        HTTP_CODE=$(curl -sSk --max-time 15 \
          -H "Authorization: Basic ${AUTH:-}" \
          -H "Accept: application/vnd.oci.image.manifest.v1+json" \
          -H "Accept: application/vnd.docker.distribution.manifest.v2+json" \
          -o /dev/null -w "%{http_code}" \
          "https://{{ _mirror_registry_host }}/v2/{{ _mirror_registry_path }}/manifests/${SIG_TAG}")
        [ "$HTTP_CODE" = "200" ] || MISSING="${MISSING} ${SIG_TAG} (HTTP ${HTTP_CODE})"
      done
      if [ -n "${MISSING}" ]; then
        echo "Missing sigstore signature manifests in mirror:${MISSING}" >&2
        exit 1
      fi
  register: _mirror_sigstore_check
  ignore_errors: true
  when:
    - not iso_exists.stat.exists
    - _use_private_registry | bool
    - _ocp_version is version('4.22', '>=')
    - (_ocp_release_image.stdout | trim) != ''

- name: Fail if mirror is missing sigstore signatures (OCP >= 4.22)
  ansible.builtin.fail:
    msg: >-
      Mirror {{ _mirror_registry }} is missing sigstore signatures required by
      OpenShift {{ _ocp_version }}:
      {{ _mirror_sigstore_check.stderr | default('') }}.
      Since 4.22, cluster nodes enforce sigstore verification of release images
      and reject unsigned pulls ("A signature was required, but no signature
      exists"). Copy the signature tags into the mirror with skopeo as documented
      in the extension README (section "Mirroring the release images"), or mirror
      with oc-mirror v2, which copies signatures by default.
  when:
    - not iso_exists.stat.exists
    - _use_private_registry | bool
    - _mirror_sigstore_check is defined
    - not (_mirror_sigstore_check.skipped | default(false))
    - (_mirror_sigstore_check.rc | default(0)) != 0

- name: Include ISO creation tasks
  ansible.builtin.import_tasks:
    file: create-iso.yaml
