---
- name: Check SSH private key exists at runner env path
  stat:
    path: "{{ runner_base_data_dir }}/env/ssh_key"
  register: ssh_private_key_stat

- name: Fail if SSH private key is missing
  fail:
    msg: "SSH private key not found at {{ runner_base_data_dir }}/env/ssh_key"
  when: not ssh_private_key_stat.stat.exists

- name: Derive SSH public key from private key
  command: "ssh-keygen -y -f {{ runner_base_data_dir }}/env/ssh_key"
  register: ssh_pubkey_cmd
  changed_when: false

- name: Set ssh_key fact (public key content for install-config.yaml)
  set_fact:
    ssh_key: "{{ ssh_pubkey_cmd.stdout | trim }}"

- name: Copy SSH private key to installation directory
  copy:
    src: "{{ runner_base_data_dir }}/env/ssh_key"
    dest: "{{ ocp_install_dir }}/ssh_key"
    mode: '0600'
    remote_src: yes

- name: Write SSH public key to installation directory
  copy:
    content: "{{ ssh_key }}\n"
    dest: "{{ ocp_install_dir }}/ssh_key.pub"
    mode: '0644'
