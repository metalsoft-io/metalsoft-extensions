[defaults]
interpreter_python = auto_silent
forks = 50
timeout = 30
display_skipped_hosts = False
; this extension's instance-array labels (slurmhead, slurmcompute) are hyphen-free, so
; their groups are valid everywhere; any other platform group with a '-' is kept as-is
; without the invalid-characters warning
force_valid_group_names = ignore
host_key_checking = False
action_warnings = False
deprecation_warnings = False
retry_files_enabled = False

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=600s -o ServerAliveInterval=30 -o ServerAliveCountMax=10
