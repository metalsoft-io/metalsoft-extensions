---
# Generated once on the head node and never rotated by a converge (a retried or later run
# finds them and keeps them). The EE has no passlib, so nothing is hashed controller-side.
- name: Secrets | MUNGE key (1 KiB random)
  ansible.builtin.shell: |
    set -o pipefail
    umask 077
    head -c 1024 /dev/urandom > {{ sl_state_dir }}/munge.key
  args:
    executable: /bin/bash
    creates: "{{ sl_state_dir }}/munge.key"

- name: Secrets | database, admin password and cluster id
  ansible.builtin.shell: |
    set -o pipefail
    umask 077
    case "{{ item.kind }}" in
      hex) openssl rand -hex 16 > "{{ item.path }}" ;;
      alnum) openssl rand -base64 48 | tr -dc 'A-Za-z0-9' | head -c {{ item.len }} > "{{ item.path }}" ;;
    esac
  args:
    executable: /bin/bash
    creates: "{{ item.path }}"
  loop:
    - { path: "{{ sl_secrets_dir }}/db_password", kind: alnum, len: 32 }
    - { path: "{{ sl_secrets_dir }}/admin_password", kind: alnum, len: 20 }
    - { path: "{{ sl_secrets_dir }}/cluster_uuid", kind: hex, len: 32 }
  loop_control:
    label: "{{ item.path | basename }}"

- name: Secrets | admin SSH key pair
  ansible.builtin.command: >-
    ssh-keygen -q -t ed25519 -N '' -C '{{ sl_admin_user }}@{{ sl_cluster_name }}'
    -f {{ sl_secrets_dir }}/admin_ssh_key
  args:
    creates: "{{ sl_secrets_dir }}/admin_ssh_key"

- name: Secrets | read back
  ansible.builtin.slurp:
    src: "{{ item }}"
  loop:
    - "{{ sl_secrets_dir }}/db_password"
    - "{{ sl_secrets_dir }}/cluster_uuid"
    - "{{ sl_secrets_dir }}/admin_ssh_key.pub"
  register: _sl_secret_files
  no_log: true

- name: Secrets | facts for this run
  ansible.builtin.set_fact:
    sl_db_password: "{{ _sl_secret_files.results[0].content | b64decode | trim }}"
    sl_cluster_uuid_new: "{{ _sl_secret_files.results[1].content | b64decode | trim }}"
    sl_admin_pubkey: "{{ _sl_secret_files.results[2].content | b64decode | trim }}"
  no_log: true

# The uuid in cluster.json wins (it is what the compute nodes already carry).
- name: Secrets | effective cluster id
  ansible.builtin.set_fact:
    sl_cluster_state_fact: >-
      {{ sl_cluster_state_fact | combine({'uuid': sl_cluster_state_fact.uuid | default(sl_cluster_uuid_new, true)}) }}
