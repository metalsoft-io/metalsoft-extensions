---
# Best effort on the leaving servers (they are wiped by the platform afterwards): stop
# slurmd so it cannot re-register between the reconfigure and the deprovisioning.
- name: Scale-in | privilege escalation (sudo-rs aware)
  ansible.builtin.include_role:
    name: node
    tasks_from: become-probe.yaml

- name: Scale-in | stop and disable slurmd
  ansible.builtin.systemd_service:
    name: slurmd
    state: stopped
    enabled: false
  failed_when: false
