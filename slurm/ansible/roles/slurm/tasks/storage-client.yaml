---
# Automounted, hard NFS mount of the head's /shared: a compute node that boots while the
# head is down still comes up; I/O waits instead of failing when the head is unreachable.
- name: Storage | mount point
  ansible.builtin.file:
    path: "{{ sl_shared_dir }}"
    state: directory
    mode: "0755"

- name: Storage | fstab entry for /shared
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: '^\S+\s+{{ sl_shared_dir }}\s'
    line: "{{ sl_head_ip }}:{{ sl_shared_dir }} {{ sl_shared_dir }} nfs4 rw,hard,noatime,_netdev,x-systemd.automount,x-systemd.mount-timeout=60 0 0"
  register: _sl_shared_fstab

- name: Storage | activate the automount
  ansible.builtin.systemd_service:
    daemon_reload: true
    name: remote-fs.target
    state: restarted
  when: _sl_shared_fstab is changed

- name: Storage | /shared reachable
  ansible.builtin.command: "timeout 90 stat {{ sl_shared_internal }}"
  register: _sl_shared_stat
  changed_when: false
  retries: 6
  delay: 10
  until: _sl_shared_stat.rc == 0
