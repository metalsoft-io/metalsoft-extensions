---
# ee-slurm — execution environment for the MetalSoft Slurm extension.
# Build/publish: see README.md "Execution environment image". The image must be
# linux/amd64; treat tags as immutable (bump tagRegistry AND the tarball name per rebuild).
#
# The bundle uses ansible.builtin modules only — no Galaxy collections, no jmespath.
# ansible-core >= 2.20 is required for the Ubuntu 26.04 nodes (Python 3.14 targets);
# 2.21 is pinned (2.20 security support ends 2026-11). ansible-core 2.22 adds sudo-rs
# password-prompt support — until then the playbooks fall back to /usr/bin/sudo.ws when
# the login user needs a sudo password (roles/node/tasks/become-probe.yaml).
version: 3
images:
  base_image:
    name: redhat/ubi10-minimal:10.1

dependencies:
  ansible_core:
    package_pip: ansible-core==2.21.5
  ansible_runner:
    package_pip: ansible-runner
  system:
    - shadow-utils [platform:rpm]
    - openssh-clients [platform:rpm]
    - python3.13 [platform:rpm]
    - python3.13-devel [platform:rpm]
    - gcc [platform:rpm]
    - make [platform:rpm]
    - libffi-devel [platform:rpm]
    - openssl-devel [platform:rpm]
  python_interpreter:
    package_system: "python3.13"
    python_path: "/usr/bin/python3.13"
  exclude:
    python:
      - docker
    system:
      - python3-Cython

build_arg_defaults:
  PKGMGR_PRESERVE_CACHE: 'always'

additional_build_steps:
  prepend_base:
    - RUN rpm -Uvh https://dl.fedoraproject.org/pub/epel/epel-release-latest-10.noarch.rpm || true
    - RUN /bin/sh -c "if [ ! -x /usr/bin/dnf ]; then ln -s /usr/bin/microdnf /usr/bin/dnf || true; fi"
  prepend_final: |
    RUN cat /etc/os-release
  append_final:
    - RUN useradd -u 1000 -g 0 -m runner || echo "User 1000 already exists"
    - RUN mkdir -p /runner/project/.ansible/tmp && chmod 1777 /runner/project/.ansible/tmp
    - RUN if [ -x /usr/bin/python3.13 ] && [ ! -x /usr/bin/python3 ]; then ln -s /usr/bin/python3.13 /usr/bin/python3 || true; fi
    - RUN echo "--- Final Image ---" && $PYCMD --version && ansible --version
