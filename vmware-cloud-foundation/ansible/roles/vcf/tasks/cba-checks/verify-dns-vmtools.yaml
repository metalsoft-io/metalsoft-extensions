---
# Verify Cloud-Builder DNS configuration via VMware Tools

- name: Initialize VMware Tools connection
  ansible.builtin.include_tasks: init-vmtools.yaml

- name: Test DNS resolution - Forward lookup (A record) for FQDN
  community.vmware.vmware_vm_shell:
    hostname: "{{ target_esxi_hostname }}"
    username: "{{ target_esxi_username }}"
    password: "{{ target_esxi_password }}"
    validate_certs: "{{ cba.validate_certs | default(false) }}"
    vm_id: "{{ cba.hostname }}"
    vm_username: "{{ cba.root_username | default('root') }}"
    vm_password: "{{ cba.root_password | default('') }}"
    vm_shell: /usr/bin/nslookup
    vm_shell_args: "{{ cba.hostname_fqdn }}"
    wait_for_process: true
  delegate_to: localhost
  register: cba_dns_forward_lookup
  retries: 5
  delay: 10
  until: cba_dns_forward_lookup.exit_code == 0
  failed_when: cba_dns_forward_lookup.exit_code != 0

- name: Test DNS resolution - Reverse lookup (PTR record) for IP
  community.vmware.vmware_vm_shell:
    hostname: "{{ target_esxi_hostname }}"
    username: "{{ target_esxi_username }}"
    password: "{{ target_esxi_password }}"
    validate_certs: "{{ cba.validate_certs | default(false) }}"
    vm_id: "{{ cba.hostname }}"
    vm_username: "{{ cba.root_username | default('root') }}"
    vm_password: "{{ cba.root_password | default('') }}"
    vm_shell: /usr/bin/nslookup
    vm_shell_args: "{{ cba.ipv4_address }}"
    wait_for_process: true
  delegate_to: localhost
  register: cba_dns_reverse_lookup
  retries: 5
  delay: 10
  until: cba_dns_reverse_lookup.exit_code == 0
  failed_when: cba_dns_reverse_lookup.exit_code != 0

- name: Summarize DNS verification result
  ansible.builtin.debug:
    msg:
      - "Cloud-Builder DNS verification completed successfully"
      - "FQDN: {{ cba.hostname_fqdn }}"
      - "IP Address: {{ cba.ipv4_address }}"
      - "Forward lookup (A): nslookup succeeded {{ cba_dns_forward_lookup.cmd_line }}"
      - "Reverse lookup (PTR): nslookup succeeded {{ cba_dns_reverse_lookup.cmd_line }}"
      - "Method: VMware Tools (exit code verification)"
