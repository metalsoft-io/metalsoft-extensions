---
- name: Setup ESXi Hosts
  hosts: all
  gather_facts: false
  collections:
    - community.vmware
  pre_tasks:
    - name: Note execution start time
      ansible.builtin.debug:
        msg: "Execution started at {{ now(utc=true).strftime('%Y-%m-%d %H:%M:%S') }} UTC"
      run_once: true
      delegate_to: localhost
  roles:
    - role: esxi
      tags: esxi

- name: Deploy VMware Cloud Foundation
  hosts: management[0]
  gather_facts: false
  collections:
    - community.vmware
  roles:
    - role: vcf
      tags: vcf

# Optional VI workload domain — created through SDDC Manager once the management
# bring-up above completed. No-op when the workload array is at 0 instances.
- name: Deploy VI workload domain
  hosts: management[0]
  gather_facts: false
  collections:
    - community.vmware
  tasks:
    - name: VI workload domain flow
      ansible.builtin.include_role:
        name: vcf
        tasks_from: wld/deploy-vi-workload-domain.yaml
      when: (groups['workload'] | default([]) | length) > 0

# Stored outputs are REPLACED by every successful run's context.json — always publish
# them as the last step (only reached when the bring-up play above succeeded).
- name: Publish extension outputs
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Emit outputs context JSON
      ansible.builtin.include_role:
        name: vcf
        tasks_from: emit-outputs.yaml
