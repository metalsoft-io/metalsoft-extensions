---
- name: Add Management Network VM Portgroup
  community.vmware.vmware_portgroup:
    hostname: "{{ esxi_hostname }}"
    username: "{{ esxi_username }}"
    password: "{{ esxi_password }}"
    hosts: "{{ inventory_hostname }}"
    switch: "{{ esxi_vswitch_name }}"
    portgroup: "{{ esxi_vm_mgmt_portgroup_name }}"
    vlan_id: "{{ esxi_vm_mgmt_vlan_id }}"
    validate_certs: "{{ esxi_validate_certs }}"
    state: present
  delegate_to: localhost

- name: Debug | ESXi host Network Configuration
  ansible.builtin.debug:
    msg: >-
      ESXi host network configuration:
        vSwitch='{{ esxi_vswitch_name }}'
        VM Management Portgroup='{{ esxi_vm_mgmt_portgroup_name }}' (VLAN ID={{ esxi_vm_mgmt_vlan_id }})
  when: vcf.validation_debug | default(false) | bool
  delegate_to: localhost
