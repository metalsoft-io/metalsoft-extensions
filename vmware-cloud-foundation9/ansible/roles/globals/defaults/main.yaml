---
extension_instance_id: "{{ extensionInstanceRecordSet.extensionInstanceId }}"
ntp_servers: "{{ extensionInstanceRecordSet.ntpServers | default(['0.us.pool.ntp.org', '1.us.pool.ntp.org']) }}"
domain: "{{ extensionInstanceVariables.domain | default(extensionInstanceRecordSet.baseDomain | default('vmware.local')) }}"
subdomain: "{{ extensionInstanceVariables.subdomain | default(extensionInstanceRecordSet.baseDomain | default('vmware.local')) }}"
# DNSResolvers (top-level extra var) is an optional comma-separated string holding one or many
# resolvers (e.g. "172.18.38.62" or "172.18.38.62,1.1.1.1"). It takes precedence over the
# (often stale) extensionInstanceRecordSet.dnsResolvers. Parse to a trimmed, non-empty list;
# if it yields nothing (unset/blank), fall back to the public resolvers.
dns_resolvers_input: "{{ configVars.DNSResolvers | default('') }}"
dns_servers: >-
  {{
    (
      (dns_resolvers_input.split(',') if (dns_resolvers_input is string) else dns_resolvers_input)
      | map('trim') | reject('equalto', '') | list
    )
    or ['1.1.1.1', '8.8.8.8']
  }}
dns_searchpath: "{{ extensionInstanceVariables.dns_searchpath | default(extensionInstanceRecordSet.baseDomain | default('vmware.local')) }}"
esxi_username: "{{ hostvars[inventory_hostname].ansible_user | default('root') }}"
esxi_hostname: "{{ hostvars[inventory_hostname].ansible_host }}"
esxi_password: "{{ hostvars[inventory_hostname].ansible_password }}"

vcf_version: "{{ extensionInstanceVariables.vcf_version | default('9.0.1.0') }}"
vcf_release_sku: "{{ extensionInstanceVariables.vcf_release_sku | default('VCF') }}" # SKU for the installer release-components API (VCF or VVF) — consumed by download-binaries.yaml
# VCF Installer 9.0.2.0 is required by Broadcom to deploy 9.0.1 components (9.0.1 BOM)
ova_name: "{{ extensionInstanceVariables.ova_name | default('VCF-SDDC-Manager-Appliance-9.0.2.0.25151285.ova') }}"

# Offline depot (VCF Installer pulls all product binaries from here)
depot:
  hostname: "{{ extensionInstanceVariables.depot_hostname | default('vmware-depot.metalsoft.dev') }}"
  port: "{{ extensionInstanceVariables.depot_port | default(443) | int }}"
  username: "{{ extensionInstanceVariables.depot_username | default('vmware-depot') }}"
  password: "{{ extensionInstanceVariables.depot_password | default('') }}"
  # internal mirrors typically run self-signed certs; set depot_validate_certs=true when a trusted CA is used
  validate_certs: "{{ extensionInstanceVariables.depot_validate_certs | default(false) | bool }}"

depot_esx_iso_name: "{{ extensionInstanceVariables.depot_esx_iso_name | default('VMware-VMvisor-Installer-9.0.1.0.24957456.x86_64.iso') }}"

# The installer OVA lives on the depot mirror itself (basic auth handled by get_url in deploy-vcf-installer.yaml)
derived_ova_url: "https://{{ depot.hostname }}:{{ depot.port }}/PROD/COMP/SDDC_MANAGER_VCF/{{ ova_name }}"
# Preserve the raw user-supplied override exactly (may be empty string)
raw_ova_url: "{{ extensionInstanceVariables.ova_url | default('') }}"

# Effective OVA URL: if raw override is non-empty (after trim) use it, else fall back to derived
effective_ova_url: >-
  {{ (raw_ova_url | trim | length > 0)
    | ternary(raw_ova_url | trim, derived_ova_url)
  }}
ova_url: "{{ effective_ova_url }}"
vcf:
  # Deployment architecture model: consolidated, standard, or custom
  architecture: "{{ extensionInstanceVariables.deployment_architecture_model | default('consolidated') }}"
  # Deployment platform ("workflowType": VCF | VCF_EXTEND | VVF)
  platform: "{{ extensionInstanceVariables.deployment_platform | default('VCF') }}"
  ceip_enabled: "{{ extensionInstanceVariables.ceip_enabled | default(false) | bool }}"
  distinct_vlan_id_vm_mgmt_and_esxi_mgmt: "{{ extensionInstanceVariables.distinct_vlan_id_vm_mgmt_and_esxi_mgmt | default(false) | bool }}"
  skip_esx_thumbprint_validation: "{{ extensionInstanceVariables.skip_esx_thumbprint_validation | default(false) | bool }}"
  validation_debug: "{{ extensionInstanceVariables.validation_debug | default(false) | bool }}"
  skip_gateway_ping_validation: "{{ extensionInstanceVariables.skip_gateway_ping_validation | default(false) | bool }}"
  deploy_automation: "{{ extensionInstanceVariables.deploy_vcf_automation | default(false) | bool }}"
  instance_name: "{{ extensionInstanceVariables.vcf_instance_name | default(extension_instance_id ~ '-vcf', true) }}"

# Extract 'management' server instance group data (base)
management_server_instance_group_base: >-
  {{ extensionInstanceRecordSet.serverInstanceGroups
     | default([])
     | selectattr('serverInstanceGroupLabel', 'equalto', 'management')
     | first
     | default({}) }}

# Filter server instances by management server instance group ID
management_server_instances: >-
  {{ extensionInstanceRecordSet.serverInstances
     | default([])
     | selectattr('serverInstanceGroupId', 'equalto', management_server_instance_group_base.serverInstanceGroupId | default(-1))
     | list
     if management_server_instance_group_base.serverInstanceGroupId is defined
     else [] }}

# Combine management server instance group data with server instances
# to be compatible with different variables.json structures
management_server_instance_group_data: >-
  {{ management_server_instance_group_base
     | combine({'serverInstances': management_server_instances}, recursive=True)
     if management_server_instance_group_base
     else {} }}

# Build an index (name -> logical network object)
logical_networks_index: >-
  {{ dict(
     (management_server_instance_group_data.logicalNetworks | default([]))
     | map(attribute='name') | list
     | zip(management_server_instance_group_data.logicalNetworks | default([]))
    )
  }}

# Extract logical networks by name
mgmt_network: "{{ logical_networks_index.get('vcf-mgmt', {}) }}"
vmotion_network: "{{ logical_networks_index.get('vcf-vmotion', {}) }}"
vsan_network: "{{ logical_networks_index.get('vcf-vsan', {}) }}"
nsx_network: "{{ logical_networks_index.get('vcf-nsx', {}) }}"

vm_mgmt_network: >-
  {{ (vcf.distinct_vlan_id_vm_mgmt_and_esxi_mgmt | bool)
    | ternary(
      logical_networks_index.get('vcf-vm-mgmt', {}),
      mgmt_network
    )
  }}
