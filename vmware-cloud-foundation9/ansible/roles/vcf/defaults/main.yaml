---
debug_vmnic_mapping: "{{ (configVars | default({})).get('validation_debug', false) | bool }}"

sddc_id: "{{ extensionInstanceRecordSet.sddc_id | default(extension_instance_id ~ '-m', true) }}"
management_pool_name: "{{ extensionInstanceVariables.management_pool_name | default(sddc_id ~ '-np1', true) }}"
vcenter_cluster_name: "{{ extensionInstanceVariables.vcenter_cluster_name | default(sddc_id ~ '-cl1', true) }}"
management_resource_pool_name: "{{ extensionInstanceVariables.management_resource_pool_name | default(sddc_id ~ '-cl1-rp-sddc-mgmt', true) }}"
networking_resource_pool_name: "{{ extensionInstanceVariables.networking_resource_pool_name | default(sddc_id ~ '-cl1-rp-sddc-edge', true) }}"
compute_user_vm_resource_pool_name: "{{ extensionInstanceVariables.compute_user_vm_resource_pool_name | default(sddc_id ~ '-cl1-rp-user-vm', true) }}"
compute_user_edge_resource_pool_name: "{{ extensionInstanceVariables.compute_user_edge_resource_pool_name | default(sddc_id ~ '-cl1-rp-user-edge', true) }}"

vm_management_portgroup_name: "{{ extensionInstanceVariables.vm_management_portgroup_name | default(sddc_id ~ '-cl1-vds1-vm-mgmt', true) }}"
esxi_management_portgroup_name: "{{ extensionInstanceVariables.esxi_management_portgroup_name | default(sddc_id ~ '-cl1-vds1-esxi-mgmt', true) }}"
vmotion_portgroup_name: "{{ extensionInstanceVariables.vmotion_portgroup_name | default(sddc_id ~ '-cl1-vds1-vmotion', true) }}"
vsan_portgroup_name: "{{ extensionInstanceVariables.vsan_portgroup_name | default(sddc_id ~ '-cl1-vds1-vsan', true) }}"

nsx_host_overlay_ip_pool_name: "{{ extensionInstanceVariables.nsx_host_overlay_ip_pool_name | default(sddc_id ~ '-cl1-tep1', true) }}"

# --- VI workload domain (optional second domain, 'workload' instance array) -----------
# Naming mirrors the management domain: '-m' suffix -> '-w'.
wld_id: "{{ extensionInstanceVariables.wld_id | default(extension_instance_id ~ '-w', true) }}"
wld_domain_name: "{{ extensionInstanceVariables.wld_domain_name | default(wld_id, true) }}"
wld_pool_name: "{{ extensionInstanceVariables.wld_pool_name | default(wld_id ~ '-np1', true) }}"
wld_cluster_name: "{{ extensionInstanceVariables.wld_cluster_name | default(wld_id ~ '-cl1', true) }}"
wld_datacenter_name: "{{ extensionInstanceVariables.wld_datacenter_name | default(wld_id ~ '-dc1', true) }}"
# Mirrors the literal mgmt vds name 'm-cl1-vds1' (dvs-specs.yaml.j2)
wld_vds_name: "{{ extensionInstanceVariables.wld_vds_name | default('w-cl1-vds1', true) }}"
wld_datastore_name: "{{ extensionInstanceVariables.wld_datastore_name | default(wld_id ~ '-cl1-ds1', true) }}"
# Isolated SSO domain (required on VCF 9). Must start with an ASCII letter (3-63 chars of
# A-Za-z0-9-), and wld_domain_name starts with the numeric cluster id — hence the prefix.
wld_sso_domain_name: "{{ extensionInstanceVariables.wld_sso_domain_name | default('wld-' ~ wld_domain_name | lower ~ '.sso.local', true) }}"
wld_tep_pool_name: "{{ extensionInstanceVariables.wld_tep_pool_name | default(wld_id ~ '-cl1-tep1', true) }}"
# 3-node NSX cluster is the VCF default; 1 is allowed for small deployments
wld_nsx_manager_count: "{{ configVars.wld_nsx_manager_count | default(3) | int }}"
# When empty, the first available vLCM cluster image (personality) is used
wld_cluster_image_name: "{{ extensionInstanceVariables.wld_cluster_image_name | default('', true) }}"
wld_host_count: "{{ groups['workload'] | default([]) | length }}"
# The workload domain is only in play with >= 3 hosts (vSAN minimum; 0 = mgmt-only)
_wld_active: "{{ (wld_host_count | int) >= 3 }}"

# --- Extension outputs (context.json) ------------------------------------------------
# The platform stores a run's artifacts/<ident>/context.json top-level keys that match
# declared output labels into the instance's customJson.outputs — and REPLACES the
# stored outputs on EVERY successful run (a run writing no context.json wipes them).
# Every playbook therefore ends with emit-outputs.yaml. All values derive from the
# recordSet allocations, so they can be recomputed on any run; allocation fqdn values
# carry a trailing dot which must be stripped.
context_json_file_path: "/runner/artifacts/{{ lookup('env', 'ANSIBLE_RUNNER_IDENT') }}/context.json"

# vm_mgmt_network (globals) already falls back to mgmt_network unless the distinct
# VM-management VLAN mode is enabled — same source network-specs.yaml uses.
_output_allocations: "{{ vm_mgmt_network | json_query('subnets[].ipAllocations[]') | default([], true) }}"

_output_installer_fqdn: "{{ _output_allocations | selectattr('tags.role', 'equalto', 'vcf-installer') | map(attribute='fqdn') | first | default('') | regex_replace('\\.$', '') }}"
_output_sddc_manager_fqdn: "{{ _output_allocations | selectattr('tags.role', 'equalto', 'sddc-manager') | map(attribute='fqdn') | first | default('') | regex_replace('\\.$', '') }}"
_output_vcenter_fqdn: "{{ _output_allocations | selectattr('tags.role', 'equalto', 'management-vcenter-server') | map(attribute='fqdn') | first | default('') | regex_replace('\\.$', '') }}"
_output_nsx_vip_fqdn: "{{ _output_allocations | selectattr('tags.role', 'equalto', 'nsx-manager-vip') | map(attribute='fqdn') | first | default('') | regex_replace('\\.$', '') }}"
_output_vcf_ops_fqdn: "{{ _output_allocations | selectattr('tags.role', 'equalto', 'vcf-operations') | map(attribute='fqdn') | first | default('') | regex_replace('\\.$', '') }}"
_output_ops_fleet_mgmt_fqdn: "{{ _output_allocations | selectattr('tags.role', 'equalto', 'ops-fleet-management') | map(attribute='fqdn') | first | default('') | regex_replace('\\.$', '') }}"
_output_ops_collector_fqdn: "{{ _output_allocations | selectattr('tags.role', 'equalto', 'ops-collector') | map(attribute='fqdn') | first | default('') | regex_replace('\\.$', '') }}"
_output_vcf_automation_fqdn: "{{ _output_allocations | selectattr('tags.role', 'equalto', 'vcf-automation') | map(attribute='fqdn') | first | default('') | regex_replace('\\.$', '') }}"
_output_wld_vcenter_fqdn: "{{ _output_allocations | selectattr('tags.role', 'equalto', 'wld-vcenter-server') | map(attribute='fqdn') | first | default('') | regex_replace('\\.$', '') }}"
_output_wld_nsx_vip_fqdn: "{{ _output_allocations | selectattr('tags.role', 'equalto', 'wld-nsx-manager-vip') | map(attribute='fqdn') | first | default('') | regex_replace('\\.$', '') }}"

# Every declared output label must be present on every write (partial writes wipe the
# omitted keys). vcf_automation_url is deliberately '' when automation is not deployed.
vcf_outputs_payload:
  installer_url: "{{ ('https://' ~ _output_installer_fqdn ~ '/vcf-installer-ui') if _output_installer_fqdn else '' }}"
  sddc_manager_url: "{{ ('https://' ~ _output_sddc_manager_fqdn) if _output_sddc_manager_fqdn else '' }}"
  vcenter_url: "{{ ('https://' ~ _output_vcenter_fqdn) if _output_vcenter_fqdn else '' }}"
  vcenter_sso_username: "administrator@{{ extensionInstanceVariables.psc_sso_domain_name | default('vsphere.local') }}"
  nsx_manager_url: "{{ ('https://' ~ _output_nsx_vip_fqdn) if _output_nsx_vip_fqdn else '' }}"
  vcf_ops_url: "{{ ('https://' ~ _output_vcf_ops_fqdn) if _output_vcf_ops_fqdn else '' }}"
  ops_fleet_mgmt_url: "{{ ('https://' ~ _output_ops_fleet_mgmt_fqdn) if _output_ops_fleet_mgmt_fqdn else '' }}"
  ops_collector_url: "{{ ('https://' ~ _output_ops_collector_fqdn) if _output_ops_collector_fqdn else '' }}"
  vcf_automation_url: "{{ ('https://' ~ _output_vcf_automation_fqdn) if (vcf.deploy_automation | bool and _output_vcf_automation_fqdn) else '' }}"
  sddc_id: "{{ sddc_id }}"
  datacenter_name: "{{ extensionInstanceVariables.vcenter_datacenter_name | default(sddc_id ~ '-dc1') }}"
  cluster_name: "{{ vcenter_cluster_name }}"
  # WLD keys are '' while the workload array is at 0 instances (like vcf_automation_url)
  wld_vcenter_url: "{{ ('https://' ~ _output_wld_vcenter_fqdn) if (_wld_active | bool and _output_wld_vcenter_fqdn) else '' }}"
  wld_vcenter_sso_username: "{{ ('administrator@' ~ wld_sso_domain_name) if _wld_active | bool else '' }}"
  wld_nsx_manager_url: "{{ ('https://' ~ _output_wld_nsx_vip_fqdn) if (_wld_active | bool and _output_wld_nsx_vip_fqdn) else '' }}"
  wld_domain_name: "{{ wld_domain_name if _wld_active | bool else '' }}"
