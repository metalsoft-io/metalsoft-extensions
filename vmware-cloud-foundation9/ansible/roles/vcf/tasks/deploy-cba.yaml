---
- name: Set ESXi facts for localhost
  set_fact:
    target_esxi_hostname: "{{ ansible_host }}"
    target_esxi_username: "{{ ansible_user | default('root') }}"
    target_esxi_password: "{{ ansible_password }}"
  delegate_to: localhost

- name: Instantiate VMware Cloud-Builder Appliance
  vmware_deploy_ovf:
    hostname: "{{ target_esxi_hostname }}"
    username: "{{ target_esxi_username }}"
    password: "{{ target_esxi_password }}"
    name: "{{ cba.hostname }}"
    wait_for_ip_address: true
    validate_certs: "{{ cba.validate_certs }}"
    power_on: true
    allow_duplicates: false
    datastore: "{{ cba.datastore }}"
    disk_provisioning: "{{ cba.disk_provisioning }}"
    inject_ovf_env: true
    url: "{{ ova_url }}"
    networks:
      "Network 1": "VM Network"
    properties:
      FIPS_ENABLE: "False"
      guestinfo.ADMIN_USERNAME: "{{ cba.admin_username }}"
      guestinfo.ADMIN_PASSWORD: "{{ cba.admin_password }}"
      guestinfo.ROOT_PASSWORD: "{{ cba.root_password }}"
      guestinfo.hostname: "{{ cba.hostname }}"
      guestinfo.ip0: "{{ cba.ipv4_address }}"
      guestinfo.netmask0: "{{ cba.ipv4_netmask }}"
      guestinfo.gateway: "{{ cba.ipv4_gateway }}"
      guestinfo.DNS: "{{ cba.ipv4_dns | default('8.8.8.8,1.1.1.1') }}"
      guestinfo.domain: "{{ domain }}"
      guestinfo.searchpath: "{{ dns_searchpath }}"
      guestinfo.ntp: "{{ ntp_servers | join(',') }}"
  delegate_to: localhost

- name: Display Cloud-Builder Appliance Initialization Wait Message
  ansible.builtin.debug:
    msg: "Waiting for Cloud-Builder Appliance API to be available at https://{{ cba.ipv4_address }}. This may take several minutes..."
  delegate_to: localhost

- name: Debug | Cloud-Builder deployed from OVA URL
  ansible.builtin.debug:
    msg: "Cloud-Builder deployment initiated using OVA URL: {{ ova_url }} (raw='{{ raw_ova_url | default('') }}' derived='{{ derived_ova_url | default('') }}')"
  when: vcf.validation_debug | default(false) | bool
  delegate_to: localhost

- name: Polling the Cloud-Builder Appliance API
  ansible.builtin.uri:
    url: https://{{ cba.ipv4_address }}
    user: "{{ cba.admin_username }}"
    password: "{{ cba.admin_password }}"
    method: GET
    force_basic_auth: true
    status_code: 200
    follow_redirects: safe
    validate_certs: "{{ cba.validate_certs }}"
  retries: "{{ cba.initialize_api_retries }}"
  delay: "{{ cba.initialize_api_retries_delay }}"
  register: cba_wait_initialize_result
  until: cba_wait_initialize_result is succeeded
  delegate_to: localhost

- name: Include Cloud-Builder verification tasks
  include_tasks: verify-cloud-builder.yaml
