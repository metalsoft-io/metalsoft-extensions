---
# NOTE: endpoints verified against SDDC Manager v1 API docs; field-level spec shapes (HostCommissionSpec/ClusterUpdateSpec) need one live confirmation against /v1/api-doc on a deployed 9.0.1 SDDC Manager.
- name: Include SDDC Manager | Clusters API task | get clusters
  ansible.builtin.import_tasks: clusters/get-clusters.yaml

# Callers may override expansion_cluster_name / expansion_hosts / expansion_vds_name
# (workload domain flow); defaults preserve the management cluster behavior.
- name: Set fact | cluster ID by name
  ansible.builtin.set_fact:
    sddc_manager_cluster_id: "{{ item.id }}"
  loop: "{{ sddc_manager_clusters_response.json.elements }}"
  when: item.name == (expansion_cluster_name | default(vcenter_cluster_name))

- name: Include SDDC Manager | Clusters API task | get cluster by ID
  ansible.builtin.import_tasks: clusters/get-cluster.yaml

- name: Set local variable | sddc_manager_cluster_update_template
  ansible.builtin.set_fact:
    sddc_manager_cluster_update_template: 'clusters/cluster-expand.json.j2'
  when: sddc_manager_cluster_update_template is not defined

- name: Include SDDC Manager | Hosts API task | get hosts
  ansible.builtin.import_tasks: hosts/get-hosts.yaml

- name: Set fact | host_expansion_specs_list
  ansible.builtin.set_fact:
    host_expansion_specs_list: "{{ host_expansion_specs_list | default([]) + [host_item_spec] }}"
  loop: "{{ expansion_hosts | default(groups['management_scale_out']) }}"
  vars:
    target_host_fqdn: "{{ hostvars[item].ansible_fqdn | default(item) }}"
    sddc_host_info: >-
      {{
        sddc_manager_hosts_response.json.elements
        | selectattr('fqdn', 'equalto', target_host_fqdn)
        | first
        | default({})
      }}
    # must match dvsName in templates/dvs-specs.yaml.j2 (mgmt) / wld_vds_name (workload)
    current_vds_name: "{{ expansion_vds_name | default(vcf.dvs_name | default('m-cl1-vds1')) }}"

    host_item_spec:
      id: "{{ sddc_host_info.id }}"
      hostNetworkSpec:
        vmNics:
          - id: "{{ expansion_uplink1_vmnic_name | default(uplink1_vmnic_name) | default('vmnic0') }}"
            vdsName: "{{ current_vds_name }}"
            moveToNvds: false
            uplink: "uplink1"
          - id: "{{ expansion_uplink2_vmnic_name | default(uplink2_vmnic_name) | default('vmnic1') }}"
            vdsName: "{{ current_vds_name }}"
            moveToNvds: false
            uplink: "uplink2"
  when: sddc_host_info.id is defined and (sddc_host_info.status | default('')) == 'UNASSIGNED_USEABLE'
  run_once: true

- name: Debug host_expansion_specs_list
  ansible.builtin.debug:
    var: host_expansion_specs_list
  run_once: true

- name: Execute SDDC Manager Cluster Expansion
  when: host_expansion_specs_list is defined and (host_expansion_specs_list | length > 0)
  run_once: true
  delegate_to: localhost
  block:
    - name: Include SDDC Manager | Clusters API task | post cluster validation
      ansible.builtin.import_tasks: clusters/post-cluster-validation.yaml

    - name: Include SDDC Manager | Clusters API task | get cluster validation status
      ansible.builtin.import_tasks: clusters/get-cluster-validation-status.yaml

    - name: Include SDDC Manager | Clusters API task | update cluster
      ansible.builtin.import_tasks: clusters/patch-cluster.yaml
