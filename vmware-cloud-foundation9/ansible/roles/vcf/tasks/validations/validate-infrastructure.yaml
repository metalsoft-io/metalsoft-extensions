---
# Infrastructure and ESXi host validation
# Validates ESXi connectivity and SSL/SSH thumbprints

- name: Validate | ESXi host variables
  tags: ['validation', 'infrastructure']
  ansible.builtin.assert:
    that:
      - esxi_username is not none
      - esxi_username | length > 0
      - esxi_hostname is not none
      - esxi_hostname | length > 0
      - esxi_password is not none
      - esxi_password | length > 0
    fail_msg: "ESXi host variables (esxi_username, esxi_hostname, esxi_password) are required"
    success_msg: "ESXi host variables are set for {{ esxi_hostname }}"

- name: Validate | SSH and SSL thumbprint if skipEsxThumbprintValidation is false
  tags: ['validation', 'infrastructure']
  ansible.builtin.assert:
    that:
      - esxi_ssh_thumbprints is defined
      - esxi_ssh_thumbprints | length > 0
      - esxi_ssl_thumbprints is defined
      - esxi_ssl_thumbprints | length > 0
    fail_msg: "If vcf.skip_esx_thumbprint_validation is false, ESXi SSH and SSL thumbprints must be collected"
    success_msg: "ESXi SSH and SSL thumbprints are collected"
  when: not (vcf.skip_esx_thumbprint_validation | default(false) | bool)
