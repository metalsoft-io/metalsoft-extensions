---
# Offline render test for the VCF 9.x SDDC bring-up spec.
# Run (9.1, the default): cd tests && ansible-playbook -i inventory.yaml render-spec.yaml
# Run (9.0.1 path):       cd tests && ansible-playbook -i inventory.yaml render-spec.yaml -e test_vcf_version=9.0.1.0
- name: Render VCF 9 SDDC spec from fixture
  hosts: localhost
  gather_facts: false
  vars_files:
    - fixtures/sample-variables.json
  vars:
    # which BOM path to render; the fixture's configVars.vcf_version is overridden with this
    test_vcf_version: "9.1.0.0"
    # the harness fakes the facts that vmnics-to-uplinks normally discovers via vCenter APIs
    uplink1_vmnic_name: vmnic0
    uplink2_vmnic_name: vmnic1
    wld_uplink1_vmnic_name: vmnic0
    wld_uplink2_vmnic_name: vmnic1
    # the harness fakes what get-cluster-image.yaml / host-commission normally resolve live
    wld_cluster_image_id: fixture-image-id
    wld_sddc_host_ids:
      esx05.vcf.example.com: host-id-05
      esx06.vcf.example.com: host-id-06
      esx07.vcf.example.com: host-id-07
  tasks:
    - name: Pin vcf_version for this render
      ansible.builtin.set_fact:
        configVars: "{{ configVars | default({}) | combine({'vcf_version': test_vcf_version}) }}"
    - name: Load globals defaults
      ansible.builtin.include_vars: { dir: ../ansible/roles/globals/defaults }
    - name: Load vcf role defaults
      ansible.builtin.include_vars: { dir: ../ansible/roles/vcf/defaults }
    - name: Build SDDC spec facts
      ansible.builtin.include_tasks: ../ansible/roles/vcf/tasks/build-sddc-spec.yaml
    - name: Render spec
      ansible.builtin.set_fact:
        sddc_spec: "{{ lookup('template', '../ansible/roles/vcf/templates/management-workload-domain.yaml.j2') | from_yaml }}"
    - name: Write rendered spec
      ansible.builtin.copy: { content: "{{ sddc_spec | to_nice_json }}", dest: /tmp/sddc-spec-9.json }

    - name: Assert | top-level shape
      ansible.builtin.assert:
        that:
          - sddc_spec.version == test_vcf_version
          - sddc_spec.workflowType == 'VCF'
          - ova_name | length > 0
          - depot_esx_iso_name | length > 0

    - name: Assert | operations/collector specs
      ansible.builtin.assert:
        that:
          - sddc_spec.vcfOperationsSpec.nodes | length >= 1
          - sddc_spec.vcfOperationsCollectorSpec.hostname | length > 0

    - name: Assert | 9.0.x — fleet management appliance, no management services blocks
      ansible.builtin.assert:
        that:
          - sddc_spec.vcfOperationsFleetManagementSpec.hostname == 'opsfm1'
          - "'vspClusterSpec' not in sddc_spec"
          - "'licenseServerSpec' not in sddc_spec"
          - "'vidbSpec' not in sddc_spec"
          - ova_name == 'VCF-SDDC-Manager-Appliance-9.0.2.0.25151285.ova'
          - depot_esx_iso_name == 'VMware-VMvisor-Installer-9.0.1.0.24957456.x86_64.iso'
      when: not (vcf_is_91 | bool)

    - name: Assert | 9.1 — VCF Management Services replace the fleet management appliance
      ansible.builtin.assert:
        that:
          - "'vcfOperationsFleetManagementSpec' not in sddc_spec"
          - sddc_spec.vspClusterSpec.platformFqdn == 'sr1'
          - sddc_spec.vspClusterSpec.instanceFqdn == 'ic1'
          - sddc_spec.vspClusterSpec.fleetFqdn == 'fc1'
          - sddc_spec.vspClusterSpec.size == 'small'
          - sddc_spec.vspClusterSpec.internalClusterCidrIpv4 == '198.18.0.0/15'
          - sddc_spec.vspClusterSpec.systemUserPassword | length >= 15
          - sddc_spec.vspClusterSpec.ipv4Pool.ipRange.startIpAddress == '10.0.10.210'
          - sddc_spec.vspClusterSpec.ipv4Pool.ipRange.endIpAddress == '10.0.10.221'
          - sddc_spec.licenseServerSpec.hostname == 'lic1'
          - sddc_spec.vidbSpec.hostname == 'idb1'
          - ova_name == 'VCF-SDDC-Manager-Appliance-9.1.0.0.25371088.ova'
          - depot_esx_iso_name == 'VMware-VMvisor-Installer-9.1.0.0.25370933.x86_64.iso'
      when: vcf_is_91 | bool

    # Automation is off in the fixture, so render its block on its own and check the pool shape
    - name: Render automation spec block
      ansible.builtin.set_fact:
        automation_spec: "{{ lookup('template', '../ansible/roles/vcf/templates/vcf-automation-spec.yaml.j2') | from_yaml }}"

    - name: Assert | automation spec — 9.1 expands the pool to an address list + platformFqdn
      ansible.builtin.assert:
        that:
          - automation_spec.vcfAutomationSpec.hostname == 'auto1'
          - automation_spec.vcfAutomationSpec.platformFqdn == 'auto1p'
          - automation_spec.vcfAutomationSpec.ipPool == ['10.0.10.200', '10.0.10.201', '10.0.10.202', '10.0.10.203', '10.0.10.204']
      when: vcf_is_91 | bool

    - name: Assert | automation spec — 9.0 keeps the [start, end] pool
      ansible.builtin.assert:
        that:
          - "'platformFqdn' not in automation_spec.vcfAutomationSpec"
          - automation_spec.vcfAutomationSpec.ipPool == ['10.0.10.200', '10.0.10.204']
      when: not (vcf_is_91 | bool)

    - name: Assert | datastore spec
      ansible.builtin.assert:
        that:
          - sddc_spec.datastoreSpec.vsanSpec.datastoreName | length > 0

    - name: Assert | host specs (full FQDNs under the site zone, no ipAddressPrivate)
      ansible.builtin.assert:
        that:
          # hosts are sent fully-qualified: dnsSpec.subdomain is the per-instance cluster
          # subdomain, which would compose wrong FQDNs for hosts living in the site zone
          - sddc_spec.hostSpecs[0].hostname is search('\.' ~ 'vcf.example.com' | regex_escape ~ '$')
          - "'ipAddressPrivate' not in sddc_spec.hostSpecs[0]"

    - name: Assert | removed 5.2 fields (pscSpecs/esxLicense/taskName)
      ansible.builtin.assert:
        that:
          - "'pscSpecs' not in sddc_spec"
          - "'esxLicense' not in sddc_spec"
          - "'taskName' not in sddc_spec"

    - name: Assert | nsxt spec
      ansible.builtin.assert:
        that:
          - sddc_spec.nsxtSpec.vipFqdn | length > 0
          - "'vip' not in sddc_spec.nsxtSpec"

    - name: Render outputs payload (context.json content)
      ansible.builtin.set_fact:
        outputs_payload: "{{ vcf_outputs_payload }}"

    - name: Assert | extension outputs payload
      ansible.builtin.assert:
        that:
          # URLs come from the allocation FQDNs (per-instance cluster subdomain), never
          # rebuilt from baseDomain; trailing dots must be stripped
          - outputs_payload.installer_url == 'https://installer.vcf9test.vcf.example.com/vcf-installer-ui'
          - outputs_payload.sddc_manager_url == 'https://sddc.vcf9test.vcf.example.com'
          - outputs_payload.vcenter_url == 'https://m-vcs1.vcf9test.vcf.example.com'
          - outputs_payload.vcenter_sso_username == 'administrator@vsphere.local'
          - outputs_payload.nsx_manager_url == 'https://m-nsx1.vcf9test.vcf.example.com'
          - outputs_payload.vcf_ops_url == 'https://ops1.vcf9test.vcf.example.com'
          # 9.0 emits the fleet management URL; 9.1 emits the management services URLs instead
          - outputs_payload.ops_fleet_mgmt_url == ('' if vcf_is_91 | bool else 'https://opsfm1.vcf9test.vcf.example.com')
          - outputs_payload.vcfms_platform_url == ('https://sr1.vcf9test.vcf.example.com' if vcf_is_91 | bool else '')
          - outputs_payload.license_server_url == ('https://lic1.vcf9test.vcf.example.com' if vcf_is_91 | bool else '')
          - outputs_payload.identity_broker_url == ('https://idb1.vcf9test.vcf.example.com' if vcf_is_91 | bool else '')
          - outputs_payload.ops_collector_url == 'https://opscp1.vcf9test.vcf.example.com'
          # fixture has deploy_vcf_automation=false -> emitted empty on purpose
          - outputs_payload.vcf_automation_url == ''
          - outputs_payload.sddc_id == 'vcf9test-m'
          - outputs_payload.datacenter_name == 'vcf9test-m-dc1'
          - outputs_payload.cluster_name == 'vcf9test-m-cl1'
          # workload group has 3 hosts in this inventory -> WLD keys populated
          - outputs_payload.wld_vcenter_url == 'https://w-vcs1.vcf9test.vcf.example.com'
          - outputs_payload.wld_nsx_manager_url == 'https://w-nsx1.vcf9test.vcf.example.com'
          - outputs_payload.wld_domain_name == 'vcf9test-w'
          - outputs_payload.wld_vcenter_sso_username == 'administrator@wld-vcf9test-w.sso.local'
          # every write must carry ALL declared output labels (partial writes wipe keys)
          - outputs_payload | length == 19
          - outputs_payload.values() | select('search', '\.$') | list | length == 0

    - name: Assert | dvs + dns specs
      ansible.builtin.assert:
        that:
          - sddc_spec.dvsSpecs[0].vmnicsToUplinks | length == 2
          - sddc_spec.dnsSpec.nameservers | length >= 1
          # subdomain must be the per-instance cluster subdomain from the installer
          # allocation FQDN (installer.vcftest.vcf.example.com), NOT the bare site zone —
          # short appliance hostname + this subdomain must equal the provisioned records
          - sddc_spec.dnsSpec.subdomain == 'vcf9test.vcf.example.com'
          - (sddc_spec.vcenterSpec.vcenterHostname ~ '.' ~ sddc_spec.dnsSpec.subdomain) == 'm-vcs1.vcf9test.vcf.example.com'

    # ---- VI workload domain (workload array at 3 hosts in this inventory) -------------
    - name: Build WLD spec facts
      ansible.builtin.include_tasks: ../ansible/roles/vcf/tasks/wld/build-wld-spec.yaml

    - name: Render WLD domain creation spec
      ansible.builtin.set_fact:
        wld_spec: "{{ lookup('template', '../ansible/roles/vcf/templates/wld/vi-workload-domain-spec.yaml.j2') | from_yaml }}"

    - name: Write rendered WLD spec
      ansible.builtin.copy: { content: "{{ wld_spec | to_nice_json }}", dest: /tmp/wld-spec-9.json }

    - name: Assert | WLD domain spec shape
      ansible.builtin.assert:
        that:
          - wld_spec.domainName == 'vcf9test-w'
          - wld_spec.deployWithoutLicenseKeys == true
          - wld_spec.vcenterSpec.name == 'w-vcs1'
          # allocation fqdn trailing dots must be stripped everywhere
          - wld_spec.vcenterSpec.networkDetailsSpec.dnsName == 'w-vcs1.vcf9test.vcf.example.com'
          - wld_spec.vcenterSpec.datacenterName == 'vcf9test-w-dc1'
          # VCF 9 requires an isolated SSO domain (joining the mgmt ELM ring is rejected)
          # must start with a letter (INVALID_SSO_DOMAIN_NAME) — domain names start with the numeric cluster id
          - wld_spec.ssoDomainSpec.ssoDomainName == 'wld-vcf9test-w.sso.local'
          - wld_spec.ssoDomainSpec.ssoDomainPassword == 'WldSso@Pass1!2X'

    - name: Assert | WLD cluster spec
      ansible.builtin.assert:
        that:
          - wld_spec.computeSpec.clusterSpecs[0].name == 'vcf9test-w-cl1'
          - wld_spec.computeSpec.clusterSpecs[0].clusterImageId == 'fixture-image-id'
          - wld_spec.computeSpec.clusterSpecs[0].hostSpecs | length == 3
          - wld_spec.computeSpec.clusterSpecs[0].hostSpecs | map(attribute='id') | sort == ['host-id-05', 'host-id-06', 'host-id-07']
          - wld_spec.computeSpec.clusterSpecs[0].datastoreSpec.vsanDatastoreSpec.datastoreName == 'vcf9test-w-cl1-ds1'
          - wld_spec.computeSpec.clusterSpecs[0].networkSpec.vdsSpecs[0].name == 'w-cl1-vds1'
          # custom vmNic uplinks require activeUplinks + teamingPolicy on every portgroup
          - wld_spec.computeSpec.clusterSpecs[0].networkSpec.vdsSpecs[0].portGroupSpecs | length == 3
          - wld_spec.computeSpec.clusterSpecs[0].networkSpec.vdsSpecs[0].portGroupSpecs | map(attribute='teamingPolicy') | unique | list == ['loadbalance_loadbased']
          - wld_spec.computeSpec.clusterSpecs[0].networkSpec.vdsSpecs[0].portGroupSpecs | map(attribute='activeUplinks') | unique | list == [['uplink1', 'uplink2']]
          - wld_spec.computeSpec.clusterSpecs[0].networkSpec.nsxClusterSpec.nsxTClusterSpec.geneveVlanId == 13
          - wld_spec.computeSpec.clusterSpecs[0].networkSpec.nsxClusterSpec.nsxTClusterSpec.ipAddressPoolSpec.subnets[0].ipAddressPoolRanges[0].start == '10.0.13.121'

    - name: Assert | WLD nsx spec
      ansible.builtin.assert:
        that:
          - wld_spec.nsxTSpec.nsxManagerSpecs | length == 3
          - wld_spec.nsxTSpec.vipFqdn == 'w-nsx1.vcf9test.vcf.example.com'
          - wld_spec.nsxTSpec.vip == '10.0.10.61'
          - wld_spec.nsxTSpec.nsxManagerSpecs[0].name == 'w-nsx1a'
          - wld_spec.nsxTSpec.nsxManagerSpecs | map(attribute='networkDetailsSpec.dnsName') | select('search', '\.$') | list | length == 0

    # ---- vmnic mapping: recordSet uplink MAC order is NOT stable (fixture reverses
    # esx02's) — the rendered device lists must still be identical across hosts --------
    - name: Build synthetic vmnic info (vmnic0 = lowest MAC on every host)
      ansible.builtin.set_fact:
        all_vmnic_info: >-
          {%- set out = {} -%}
          {%- for si in management_server_instance_group_data.serverInstances -%}
          {%- set macs = si.logicalNetworks[0].uplinks | map('upper') | sort -%}
          {%- set _ = out.update({si.host: {'vmnic_details': [
                {'device': 'vmnic0', 'mac': macs[0], 'status': 'Connected'},
                {'device': 'vmnic1', 'mac': macs[1], 'status': 'Connected'}]}}) -%}
          {%- endfor -%}
          {{ out }}

    - name: Render host -> network -> uplink devices mapping
      ansible.builtin.set_fact:
        rendered_uplink_devices: "{{ lookup('template', '../ansible/roles/vcf/templates/vmnics/host_network_uplink_devices.json.j2') | from_json }}"

    - name: Assert | uplink device lists identical across hosts despite reversed MAC order
      ansible.builtin.assert:
        that:
          - rendered_uplink_devices['esx01.vcf.example.com']['vcf-mgmt'] == ['vmnic0', 'vmnic1']
          - rendered_uplink_devices['esx02.vcf.example.com']['vcf-mgmt'] == ['vmnic0', 'vmnic1']
          - >-
            rendered_uplink_devices.values() | map(attribute='vcf-mgmt') | unique | list | length == 1
        fail_msg: >-
          The vmnic mapping treated the recordSet uplinks MAC order as meaningful —
          esx02 (reversed order) rendered {{ rendered_uplink_devices['esx02.vcf.example.com']['vcf-mgmt'] }}.

    - name: Render WLD network pool spec
      ansible.builtin.set_fact:
        wld_pool_spec: "{{ lookup('template', '../ansible/roles/vcf/templates/wld/network-pool-spec.json.j2') | from_json }}"

    - name: Assert | WLD network pool spec
      ansible.builtin.assert:
        that:
          - wld_pool_spec.name == 'vcf9test-w-np1'
          - wld_pool_spec.networks | map(attribute='type') | sort == ['VMOTION', 'VSAN']
          - wld_pool_spec.networks | selectattr('type', 'equalto', 'VMOTION') | map(attribute='ipPools') | first | first | dict2items | map(attribute='value') | select('equalto', '') | list | length == 0
          - wld_pool_spec.networks | selectattr('type', 'equalto', 'VSAN') | map(attribute='ipPools') | first | first | dict2items | map(attribute='value') | select('equalto', '') | list | length == 0
