---
# onEdit preDeploy. Hosts leaving the 'esxi' array (esxi_scale_in) are still installed: check that
# none carries vCenter or running VMs, then remove them from vCenter before MetalSoft wipes them.
# No-op when nothing is removed.
- name: Remove leaving ESXi hosts from vCenter
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Scale in
      ansible.builtin.include_role:
        name: vcsa
        tasks_from: scale-in.yaml
      when: groups['esxi_scale_in'] | default([]) | length > 0

# A run that writes no context.json wipes the stored outputs — re-emit them.
- name: Publish extension outputs
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Emit outputs context JSON
      ansible.builtin.include_role:
        name: vcsa
        tasks_from: emit-outputs.yaml
